# Controllo automatico a ogni push su prova e main: gli script si compilano, nessun errore vero di pyflakes, le prove su dati finti, i pesi dei file,
# i file e i link delle pagine, la prova delle pagine in un browser (0 errori JavaScript). Non ricalcola i risultati: non ci sono i dati grezzi.
name: Controllo

on:
  push:
    branches: [prova, main]
  pull_request:

jobs:
  controllo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Librerie
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy pandas pyflakes pillow playwright
          python -m playwright install --with-deps chromium

      - name: Gli script si compilano
        run: python -m compileall -q scripts

      - name: pyflakes (solo errori veri, non variabili o import inutilizzati)
        run: |
          python -m pyflakes scripts > pyflakes.txt || true
          grep -v -E "imported but unused|assigned to but never used|f-string is missing placeholders|redefinition of unused" pyflakes.txt > errori.txt || true
          cat errori.txt
          test ! -s errori.txt

      - name: Prove su dati finti
        run: |
          python scripts/prove/prova_traduzione.py
          python scripts/prove/prova_funzioni_comuni.py
          python scripts/comuni.py
          python scripts/prove/prova_riassunti.py
          python scripts/99_area_tempi.py --finto
          python scripts/rifai_tutto.py --prova-secca
          python scripts/schede_risultati.py

      - name: Pesi dei file in git
        run: python scripts/controlla_pesi_git.py

      - name: File e link delle pagine
        run: python scripts/86_controlla_file_pagine.py --ci

      - name: Prova delle pagine nel browser
        run: python scripts/prova_pagine.py --senza-screenshot
