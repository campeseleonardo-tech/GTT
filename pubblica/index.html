<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mobilità a Torino</title>
<style>
  :root{ --bg:#f4f5f7; --card:#ffffff; --ink:#1d2330; --muted:#5d6678; --line:#dfe3ea; --accent:#1b6f73; }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body{max-width:980px;margin:0 auto;padding:40px 16px 48px}
  h1{font-size:34px;line-height:1.15;margin:0 0 12px}
  .intro{margin:0 0 22px;padding:0;list-style:none;max-width:62ch;font-size:16px}
  .intro li{margin:4px 0}
  .bottoni{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:34px}
  .btn{display:inline-block;flex:1 1 200px;text-align:center;border:1px solid var(--accent);border-radius:12px;padding:16px 22px;
    font-size:18px;font-weight:700;text-decoration:none;color:var(--accent);background:#fff}
  .btn.primario{background:var(--accent);color:#fff}
  .btn:hover,.btn:focus-visible{box-shadow:0 4px 18px rgba(27,111,115,.28)}
  h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
  .riquadri{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  @media (max-width:640px){ .riquadri{grid-template-columns:1fr} h1{font-size:28px} }
  .riquadro{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit;background:var(--card);
    border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:0 2px 10px rgba(20,30,50,.08)}
  .riquadro:hover,.riquadro:focus-visible{border-color:var(--accent);box-shadow:0 4px 18px rgba(27,111,115,.18)}
  .riquadro .num{font-size:12px;color:var(--muted)}
  .riquadro h3{margin:0;font-size:17px;line-height:1.3}
  .grande{display:flex;align-items:baseline;gap:8px;border-top:1px solid var(--line);padding-top:10px;margin-top:auto}
  .grande .val{font-size:30px;font-weight:700;color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}
  .grande .txt{font-size:12.5px;color:var(--muted)}
  .vuoto{color:var(--muted)}
</style>
</head>
<body>

<h1>Mobilità a Torino</h1>
<ul class="intro">
  <li>Un progetto di analisi dei dati per capire come funziona la città.</li>
  <li>Chi va dove, dove mancano servizi, dove sono le criticità del trasporto pubblico.</li>
  <li>Ogni numero viene da dati veri e porta con sé i suoi limiti.</li>
</ul>
<div class="bottoni">
  <a class="btn primario" href="mappa_torino.html">Mappa</a>
  <a class="btn" href="risultati.html">Risultati</a>
</div>

<h2>Cinque risultati</h2>
<div id="riquadri" class="riquadri"></div>

<script src="data/schede_risultati.js"></script>
<script>
"use strict";
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function formattaNumero(n){
  if(typeof n !== "number" || !Number.isFinite(n)) return esc(String(n));
  if(Number.isInteger(n)) return (n < 0 ? "−" : "") + String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  return n.toLocaleString("it-IT", {maximumFractionDigits:1});
}
const schede = (Array.isArray(window.SCHEDE_RISULTATI) ? window.SCHEDE_RISULTATI : []).filter(s => s && s.forma && s.forma.numero)
  .sort((a, b) => (parseFloat(a.numero_pubblico != null ? a.numero_pubblico : a.risultato) || 99) - (parseFloat(b.numero_pubblico != null ? b.numero_pubblico : b.risultato) || 99));
document.getElementById("riquadri").innerHTML = schede.length
  ? schede.map(s => {
      const n = s.forma.numero;
      return `<a class="riquadro" href="risultati.html#p${esc(s.numero_pubblico != null ? s.numero_pubblico : s.risultato)}">
        <div class="num">Risultato ${esc(s.numero_pubblico != null ? s.numero_pubblico : s.risultato)}</div>
        <h3>${esc(s.forma.titolo)}</h3>
        <div class="grande"><span class="val">${formattaNumero(n.valore)}${n.unita === "%" ? "%" : ""}</span>
          <span class="txt">${n.unita && n.unita !== "%" ? esc(n.unita) + " " : ""}${esc(n.testo)}</span></div>
      </a>`;
    }).join("")
  : '<p class="vuoto">I risultati non sono ancora disponibili.</p>';
</script>
</body>
</html>
