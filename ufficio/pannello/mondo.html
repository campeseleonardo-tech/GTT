<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="token" content="__TOKEN__">
<title>Mondo</title>
<style>
html,body{margin:0;height:100%;background:#15161a;font:14px system-ui,"Segoe UI",sans-serif;color:#ececf1;overflow:hidden}
#world{position:fixed;inset:0}
#bar{position:fixed;left:14px;top:14px;z-index:5;display:flex;gap:8px;align-items:center}
.btn{border:1px solid #33343c;background:#1f2026e6;color:#ececf1;border-radius:8px;padding:6px 11px;font:inherit;cursor:pointer;text-decoration:none}
.chip{background:#1f2026e6;border:1px solid #33343c;border-radius:99px;padding:4px 10px;font-size:12px}
</style></head><body>
<div id="world" aria-label="Mondo"></div>
<div id="bar"><a class="btn" href="/">← Ufficio</a><span class="chip" id="info">…</span></div>
<script src="mondo.js"></script>
<script>
/* Il Mondo: la parte "gioco" dell'Ufficio. Ogni progetto e' un edificio, ogni task un personaggio.
   Clic su un personaggio = apre quella task nell'Ufficio; clic sul castello = torna all'Ufficio. */
var TOKEN=document.querySelector('meta[name=token]').content;
var MAPSTATO={in_coda:'in_coda',in_corso:'in_corso',fatto:'completato',fallito:'fallito',bloccato:'bloccato',incompleto:'incompleto',da_approvare:'da_approvare',completato:'completato'};
Mondo.onSelect=function(id){location.href='/#task='+encodeURIComponent(id);};
Mondo.onCommand=function(){location.href='/';};
function load(){
  fetch('/api/ufficio',{headers:{'X-Token':TOKEN}}).then(function(r){return r.json();}).then(function(S){
    var att=S.progetti.filter(function(p){return p.stato!=='archiviato';});
    var dips=att.map(function(p){return {id:p.id,nome:p.nome,colore:p.colore,sub:p.obiettivo||''};});
    var tasks=[];
    att.forEach(function(p){
      if(p.cv){p.cv.offerte.forEach(function(o){if(o.stato!=='scartata')tasks.push({id:o.id,dip:p.id,stato:MAPSTATO[o.stato]||o.stato,titolo:o.titolo,nome:o.azienda||o.titolo});});}
      (p.tasks||[]).forEach(function(t){if(t.cartella!=='sospesi')tasks.push({id:t.id,dip:p.id,stato:(t.approvare?'da_approvare':MAPSTATO[t.stato]||t.stato),titolo:t.titolo,nome:t.id.split('-')[0]});});
    });
    Mondo.sync({root:document.getElementById('world'),dips:dips,tasks:tasks,theme:'campagna',weather:null});
    var n=(S.approva||[]).length+(S.domande||[]).length;
    document.getElementById('info').textContent=(S.agente?'al lavoro: '+S.agente.titolo:'nessuno al lavoro')+(n?' · '+n+' cose per te':'');
  }).catch(function(e){document.getElementById('info').textContent='non riesco a leggere lo stato';});
}
load();setInterval(load,8000);
</script>
</body></html>
