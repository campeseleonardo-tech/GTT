<style>

.row{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);min-width:0}.row:first-of-type{border-top:0}

.cnt{font-size:12px;color:var(--ink2);font-weight:400}

<script>
var TOKEN=document.querySelector('meta[name=token]').content, S=null, CUR=null, CHAT=null, busyChat=false;
var HELP={
 meter:"Stima del consumo degli agenti e della chat del pannello nelle ultime 5 ore. 100% = token pesati impostati in Impostazioni (oggi 1.000.000, tua stima). A 80% avviso, a 100% i nuovi lavori aspettano che la finestra scenda. La chat Cowork non e' contata.",
 centro:"Raccoglie tutto da tutti i progetti: cosa serve da te, in che ordine lavoreranno gli agenti e cosa e' appena successo.",
 serve:"Cose che partono solo con il tuo OK: offerte (CV/lettera) e task grandi. Clic sul titolo per la scheda corta.",
 dom:"Domande degli agenti. Quasi sempre NON li fermano: l'agente ha fatto una scelta provvisoria (bordo colorato) e ha continuato. Se rispondi in modo diverso parte da sola una piccola correzione; la risposta vale anche per le task future del progetto. ⏸ = l'agente si e' fermato e aspetta te.",

 diario:"Una riga per ogni cosa successa, scritta dal programma (0 token) dal rapporto dell'agente. Clic su una riga per i dettagli.",
 prog:"Una scheda per progetto. Clic per aprirla: descrizione, cose fatte, cose in sospeso, domande. Le task si aggiungono dentro il progetto o dalla chat.",
 arch:"Progetti chiusi, con il motivo. Le loro task di chiusura restano spente finche' non le attivi.",

 coda2:"Partono in quest'ordine appena si libera un posto, alternando i progetti per priorità (3-2-1). Nessun orario fisso: il controllo è subito dopo ogni tua azione, poi ogni minuto (pannello aperto) o ogni 5 minuti (pannello chiuso).",
 cons:"Token pesati: il costo di ogni chiamata convertito in token. Le letture dalla cache costano poco e quindi pesano poco, come nei limiti di Claude. Contati dai log del PC (agenti, candidature, chat del pannello); la chat Cowork non è contata. Le barre dei progetti sono relative a quello che ha consumato di più nel periodo.",
 mot:"Claude (Pro): come sempre. Gratis, poi Claude: prova prima un modello gratuito di OpenRouter; se non funziona passa a Claude. Solo gratis: mai Claude, se non funziona finisce in Da sistemare. OpenRouter, modello scelto: usa il modello scritto nel task (anche a pagamento, dal credito OpenRouter). La chiave è salvata fuori dalle cartelle che la chat può leggere.",
 cal:"Facoltativo. Scrivi i % che vedi in Claude (5 ore e 7 giorni): il pannello li salva accanto ai token contati in quel momento. Da 3 annotazioni stima quanti token valgono il 100%.",
 chat:"Gratis = modelli gratuiti forti (Gemini, Cerebras, Groq...), non toccano il Pro. Claude = Sonnet, sforzo dalle Impostazioni. Sotto ogni risposta: chi ha risposto, token e secondi. Chiedi cosa succede, descrivi una task, fai modifiche al pannello. Le azioni partono solo dopo la tua conferma. Tutto finisce nel log (pannello\\chat_log.md) che rivediamo in Cowork.",
 scheda:"La scheda progetto e' il documento centrale del progetto: sopra scrivi tu (obiettivo, contesto, regole, direzioni), sotto l'Ufficio aggiorna da solo lo stato. 💡 Consigli: un agente propone le prossime task e domande (~5-10%). 🔍 Revisione critica: Opus guarda tutto da capo (~30-50%).",
 task:"Le task del progetto in tutte le cartelle: in coda, fatte, fallite, sospese (spente)."};
function hlp(k){return '<span class="hlp" data-h="'+k+'">?<span class="tip">'+esc(HELP[k]||k)+'</span></span>';}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function $(id){return document.getElementById(id);}
function api(path,body){var h={'X-Token':TOKEN};if(body)h['Content-Type']='application/json';
  return fetch(path,{method:body?'POST':'GET',headers:h,body:body?JSON.stringify(body):undefined}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();});}
function toast(m,err){var t=$('toast');t.textContent=m;t.className='toast'+(err?' err':'');t.style.display='block';clearTimeout(t._t);t._t=setTimeout(function(){t.style.display='none';},4500);}
function act(path,body,after){return api(path,body).then(function(r){toast(r.msg||(r.ok?'Fatto.':'Non riuscito.'),!r.ok);refresh();if(after)after(r);return r;}).catch(function(e){toast('Errore: '+e.message,true);});}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}
function prj(id){return (S&&S.progetti||[]).find(function(p){return p.id===id;})||{nome:id||'—',sigla:(id||'?').slice(0,2).toUpperCase(),colore:'#777'};}
function tag(id){var p=prj(id);return '<span class="tag" style="background:'+esc(p.colore)+'">'+esc(p.sigla||p.nome)+'</span>';}
function pill(st){var m={fatto:['ok','fatto'],done:['ok','fatto'],completato:['ok','fatto'],in_corso:['r','in corso'],in_coda:['','in coda'],da_approvare:['w','da approvare'],
  bloccato:['w','domande'],fallito:['b','fallito'],failed:['b','fallito'],incompleto:['w','incompleto'],sospeso:['','spento'],scartata:['','scartata'],da_fare:['','da fare'],limit:['w','limite'],blocked:['w','domande']};
  var x=m[st]||['',st];return '<span class="pill '+x[0]+'">'+esc(x[1])+'</span>';}
function fsec(s){if(s==null)return '';s=Math.round(s);return s<90?s+' s':Math.round(s/60)+' min';}
function sid(id){var m=String(id||'').match(/^[A-Z]+\d+/);return m?m[0]:String(id||'');}
function corto(t){return String(t||'').replace(/\s*\((m\/w\/d|w\/m\/d|m\/f\/d|f\/m\/x|mwd)\)/ig,'').replace(/^(.{0,60}).*$/,'$1');}
function sm(q){return q?(' · <b>'+q+'%</b>'):'';}

/* ---------------- tema e aiuti ---------------- */
function tema(t){if(t==='light')document.documentElement.dataset.theme='light';else delete document.documentElement.dataset.theme;}
tema(ls('tema'));
$('bTema').onclick=function(){var n=document.documentElement.dataset.theme==='light'?'dark':'light';tema(n);ls('tema',n);};
[['hProg','prog'],['hArch','arch'],['hChat','chat']].forEach(function(x){$(x[0]).innerHTML=hlp(x[1]);});
document.addEventListener('click',function(e){var h=e.target.closest('.hlp');document.querySelectorAll('.hlp.on').forEach(function(x){if(x!==h)x.classList.remove('on');});if(h){e.stopPropagation();h.classList.toggle('on');}
  if(!e.target.closest('#menu'))$('menu').classList.remove('open');},true);

/* ---------------- render principale ---------------- */
function refresh(){return api('/api/ufficio').then(function(s){S=s;render();}).catch(function(e){$('sema').innerHTML='<span style="color:var(--bad)">Non riesco a leggere lo stato: '+esc(e.message)+'</span>';});}
function motSel(id,val,conProg){var L=(S.motori&&S.motori.lista)||{claude:'Claude (Pro)'};
  return '<select id="'+id+'">'+(conProg?'<option value="">Come il progetto</option>':'')+Object.keys(L).map(function(k){return '<option value="'+k+'"'+(val===k?' selected':'')+'>'+esc(L[k])+'</option>';}).join('')+'</select>';}
function motNome(k){var L=(S.motori&&S.motori.lista)||{};return L[k]||'Claude (Pro)';}
function fdur(s){if(s==null)return '';s=Math.max(0,Math.round(s));if(s<60)return 'ora';var m=Math.round(s/60);if(m<60)return m+' min';var h=Math.floor(s/3600),mm=Math.round((s%3600)/60);
  if(h<24)return h+' h'+(h<3&&mm?' '+mm+' min':'');var d=Math.floor(h/24);return d+(d===1?' giorno':' giorni');}
function fk(n){n=n||0;if(n>=1e6)return (n/1e6).toFixed(n>=1e7?0:1).replace('.',',')+' M';if(n>=1000)return Math.round(n/1000)+'k';return String(n);}
function pnome(id){if(id==='chat')return 'Chat del pannello';return prj(id).nome||id;}
var PER='5h';try{PER=ls('per')||'5h';}catch(e){}
function render(){
  var U=S.succede||{lavoro:[],serve:[],sistemare:[],coda:[],pausa:[]},C=S.consumo;
  /* riga in alto */
  var p=[];
  if(!U.lavoro.length)p.push('<span class="pl">'+(U.fermo_da_s!=null?'Fermo da '+fdur(U.fermo_da_s):'Nessuno al lavoro')+'</span>');
  else p.push('<span class="pl"><i style="background:var(--run)"></i>'+U.lavoro.length+' al lavoro</span>');
  if(U.serve.length)p.push('<span class="pl" style="color:var(--you)"><i style="background:var(--you)"></i>'+U.serve.length+(U.serve.length===1?' aspetta te':' aspettano te')+'</span>');
  if(U.sistemare.length)p.push('<span class="pl" style="color:var(--bad)"><i style="background:var(--bad)"></i>'+U.sistemare.length+' da sistemare</span>');
  if(U.limite)p.push('<span class="pl" style="color:var(--bad)">limite di Claude fino alle '+esc(U.limite)+'</span>');
  if(U.pausa.length)p.push('<span class="muted">'+U.pausa.map(function(x){return esc(x.nome)+' in pausa';}).join(' · ')+'</span>');
  if(U.coda.length)p.push('<span class="muted">'+U.coda.length+' in coda</span>');
  $('sema').innerHTML=p.join('<span class="vs"></span>');
  $('use').innerHTML=useHtml(S.consumo_breve);
  $('succ').innerHTML=succHtml(U,null);
  $('cons').innerHTML=consHtml();
  /* progetti */
  var att=S.progetti.filter(function(p){return p.stato!=='archiviato';}),arc=S.progetti.filter(function(p){return p.stato==='archiviato';});
  $('progetti').innerHTML=att.map(pCard).join('');
  $('archiviati').innerHTML=arc.map(pCard).join('');$('archHead').style.display=arc.length?'':'none';
  var DI=S.diario||[];if($('diarioMain'))$('diarioMain').innerHTML=DI.slice(0,12).map(dRow).join('')||'<div class="calm">Niente ancora.</div>';
  if(CUR&&CUR.live)CUR.live();
}
function rowHtml(cls,tit,sub,tm,tm2,btns,attrs){
  return '<div class="it '+cls+'"><div class="m"><div class="tt" '+(attrs||'')+'>'+esc(tit)+'</div><div class="sb">'+sub+'</div>'+(tm2&&tm2.prog!=null?'<div class="prog"><i style="width:'+tm2.prog+'%"></i></div>':'')+'</div>'+
    (tm?'<div class="tm"><div class="t1">'+esc(tm)+'</div>'+(tm2&&tm2.sotto?'<div class="t2">'+esc(tm2.sotto)+'</div>':'')+'</div>':'')+(btns||'')+'</div>';}
function apri(x){return x.progetto==='candidature'?'data-pproj="candidature"':(x.id?'data-task="'+esc(x.id)+'"':'');}
function succHtml(U,pid){
  function mine(l){return pid?l.filter(function(x){return x.progetto===pid;}):l;}
  function pp(x){return pid?'':esc(pnome(x.progetto))+' · ';}
  var lav=mine(U.lavoro),ser=mine(U.serve),sis=mine(U.sistemare),cod=mine(U.coda),pau=pid?U.pausa.filter(function(x){return (pid==='candidature')===(x.sorgente==='cv');}):U.pausa;
  var h=pid?'':'<h3>Cosa succede'+hlp('succ')+'</h3>';
  if(lav.length)h+='<div class="sx">Al lavoro <span class="n">'+lav.length+'</span></div>'+lav.map(function(x){
    return rowHtml('run',x.titolo,pp(x)+esc(x.motore||'')+' · <b>'+esc(x.fase)+'</b>',fdur(x.da_s),null,'',apri(x));}).join('');
  if(ser.length)h+='<div class="sx">Serve te <span class="n">'+ser.length+'</span></div>'+ser.map(function(x){
    var b='';
    if(x.tipo==='offerta')b='<button class="btn sm y" data-sa="offok" data-id="'+esc(x.id)+'">Approva</button><button class="btn sm" data-sa="offapri" data-id="'+esc(x.id)+'">Apri</button>';
    else if(x.tipo==='approva')b='<button class="btn sm y" data-sa="taskok" data-id="'+esc(x.id)+'">Approva</button><button class="btn sm" data-task="'+esc(x.id)+'">Apri</button>';
    else if(x.tipo==='decisione')b='<button class="btn sm y" data-sa="dec" data-id="'+esc(x.id)+'">Rispondi</button>';

    return rowHtml('you',x.titolo,pp(x)+'<b>'+esc(x.dettaglio)+'</b>',fdur(x.da_s),null,b,x.tipo==='offerta'?'data-sa="offapri" data-id="'+esc(x.id)+'"':apri(x));}).join('');

  if(cod.length)h+='<div class="sx">In coda <span class="n">'+cod.length+'</span>'+hlp('coda2')+'</div>'+cod.map(function(x){
    return rowHtml('',x.titolo,pp(x)+esc(x.dettaglio),'',null,x.cima?'<button class="btn sm" data-cima="'+esc(x.id)+'">In cima</button>':'',apri(x));}).join('');
  if(pau.length)h+='<div class="sx">In pausa <span class="n">'+pau.length+'</span></div>'+pau.map(function(x){
    return rowHtml('',x.nome,'messo in pausa da te',fdur(x.da_s),null,'<button class="btn sm" data-sa="riprendi" data-id="'+esc(x.sorgente)+'">Riprendi</button>');}).join('');
  if(!lav.length&&!ser.length&&!sis.length&&!cod.length&&!pau.length)h+='<div class="calm">'+(pid?'Niente in corso e niente per te in questo progetto.':'Tutto tranquillo: niente in corso e niente per te.')+'</div>';
  if(!pid){var f=[];
    if(U.ultimo)f.push('Ultimo finito: <b>'+esc(U.ultimo.titolo||'')+'</b>'+(U.ultimo.progetto?' ('+esc(pnome(U.ultimo.progetto))+')':'')+(U.ultimo.da_s!=null?', '+fdur(U.ultimo.da_s)+' fa':''));
    f.push(U.limite?'Limite di Claude: fino alle '+esc(U.limite):'Limite di Claude: nessuno');

    h+='<div class="foot">'+f.map(function(x){return '<span>'+x+'</span>';}).join('')+'</div>';}
  return h;}
function pStato(p){var U=S.succede||{lavoro:[],serve:[],sistemare:[],coda:[],pausa:[]};
  function f(l){return l.filter(function(x){return x.progetto===p.id;});}
  var l=f(U.lavoro),s=f(U.serve),x=f(U.sistemare),c=f(U.coda),pa=U.pausa.filter(function(y){return (p.id==='candidature')===(y.sorgente==='cv');});
  if(l.length)return '<span class="pl"><i style="background:var(--run)"></i>al lavoro</span>';
  if(x.length)return '<span class="pl" style="color:var(--bad)"><i style="background:var(--bad)"></i>da sistemare</span>';
  if(s.length)return '<span class="pl" style="color:var(--you)"><i style="background:var(--you)"></i>serve te'+(s[0].da_s!=null?' · '+fdur(s[0].da_s):'')+'</span>';
  if(pa.length&&p.stato!=='archiviato')return '<span class="pl muted"><i style="background:var(--idle)"></i>in pausa'+(pa[0].da_s!=null?' · '+fdur(pa[0].da_s):'')+'</span>';

function pCard(p){
  var g=p.stato==='archiviato'?(p.motivo_archivio||p.obiettivo):(p.obiettivo||'');
  var oggi=S.consumo?S.consumo.oggi.progetti:{},mx=Math.max.apply(null,Object.keys(oggi).map(function(k){return oggi[k];}).concat([1])),v=oggi[p.id]||0;

    '<div class="st">'+pStato(p)+'</div><div class="ubar" title="consumo di oggi: '+fk(v)+' token"><i style="width:'+(100*v/mx)+'%;background:'+esc(p.colore)+'"></i></div></div>';}

   '<div class="more">'+esc([(x.quando||''),x.titolo,x.dettagli,x.secondi?('durata '+fsec(x.secondi)):'' ,x.riassunto].filter(Boolean).join('\n'))+
   (x.rapporto?'\n<a data-open="'+esc(x.rapporto)+'">Apri il rapporto</a>':'')+(x.task&&x.progetto!=='candidature'?' · <a data-task="'+esc(x.task)+'">Scheda del task</a>':'')+'</div></div></div>';}

  var op=(q.opzioni||[]).map(function(o){var d=q.scelta&&o.toLowerCase()===q.scelta.toLowerCase();return '<button class="opt'+(d?' def':'')+'" data-qa="'+i+'" data-v="'+esc(o)+'" title="'+(d?'scelta provvisoria dell\'agente':'')+'">'+esc(o)+(d?' <small>(già usata)</small>':'')+'</button>';}).join('');
  var ctx=(q.progetto?tag(q.progetto)+' ':'')+(q.task?'<a class="lk" data-task="'+esc(q.task)+'">'+esc(q.task_titolo||q.task)+'</a>'+(q.task_stato?' <span class="muted">· '+esc(q.task_stato.replace('_',' '))+'</span>':''):'')+(q.quando?' <span class="muted">· '+esc(String(q.quando).slice(5,16))+'</span>':'');
  return '<div class="q">'+(ctx?'<div class="qctx">'+ctx+'</div>':'')+(q.ferma?'⏸ ':'')+'<b>'+esc(q.domanda)+'</b>'+
    (q.perche?'<div class="muted" style="font-size:13px;margin-top:3px">Perché lo chiede: '+esc(q.perche)+'</div>':'')+
    (q.dove?'<div class="muted" style="font-size:13px">Dove: '+esc(q.dove)+'</div>':'')+
    (q.cambia?'<div class="muted" style="font-size:13px">Cosa cambia: '+esc(q.cambia)+'</div>':'')+
    (q.scelta?'<div class="muted" style="font-size:13px;margin-top:3px">Nel frattempo l\'agente ha proceduto con <b>'+esc(q.scelta)+'</b>: se confermi resta così, se scegli altro parte una task che corregge il lavoro.</div>':'')+
    '<div class="opts">'+op+'<button class="opt" data-qx="'+i+'">Altro…</button></div></div>';}
function openDomande(pid,tid){
  function html(){var L=[];(S.domande||[]).forEach(function(q,i){if(q.progetto===pid&&(q.tipo==='cv'||q.tipo==='agente')&&(!tid||q.task===tid||(q.tipo==='cv'&&tid==='candidature')))L.push(qHtml(q,i));});
    return '<h2>Domande · '+esc(pnome(pid))+'</h2><div class="muted">Tocca una risposta. Se è diversa dalla scelta provvisoria parte da sola una piccola correzione.</div>'+(L.join('')||'<div class="calm">Nessuna domanda aperta.</div>');}
  drawer(html(),function(){$('dBody').innerHTML=html();});}

/* ---------------- click globali ---------------- */
document.addEventListener('click',function(e){
  var t=e.target, d;
  if((d=t.closest('[data-sa]'))){saAct(d.dataset.sa,d.dataset.id,d.dataset.p);return;}
  if((d=t.closest('[data-pproj]'))){openProj(d.dataset.pproj);return;}
  if((d=t.closest('[data-tstop]'))){stopTask(d.dataset.tstop);return;}
  if(t.closest('[data-m2]')){menu(t.closest('[data-m2]').dataset.m2);return;}
  if(t.closest('[data-cback]')){closeD();return;}
  if((d=t.closest('[data-ctab]'))){CS.tab=d.dataset.ctab;drawCons();return;}
  if(t.closest('[data-cclear]')){CS.progetto='';CS.modello='';openConsumo();return;}
  if(t.closest('[data-cdet]')){openConsumo(localStorage.getItem('cper')||'oggi');return;}
  if((d=t.closest('[data-cper]'))){openConsumo(d.dataset.cper);return;}
  if((d=t.closest('[data-cproj]'))){openProj(d.dataset.cproj);return;}
  if((d=t.closest('[data-cmod]'))){CS.modello=d.dataset.cmod;CS.tab='rias';openConsumo();return;}
  if((d=t.closest('[data-cpf]'))){CS.progetto=d.dataset.cpf;CS.tab='rias';openConsumo();return;}
  if(t.id==='cAn'){act('/api/annota',{pct5h:$('c5').value,pct7g:$('c7').value});return;}
  if(t.closest('#sema')){closeD();$('succ').scrollIntoView({behavior:'smooth',block:'start'});return;}
  if(t.closest('#use')){openConsumo(localStorage.getItem('cper')||'oggi');return;}
  if((d=t.closest('[data-apok]'))){var x=S.approva[+d.dataset.apok];if(x.tipo==='offerta')act('/api/approva',{sorgente:'cv',id:x.id});else act('/api/task_approva',{id:x.id});return;}
  if((d=t.closest('[data-apno]'))){var x=S.approva[+d.dataset.apno];scartaOfferta(x.id,x.titolo);return;}
  if((d=t.closest('[data-ap]'))){var x=S.approva[+d.dataset.ap];if(x.tipo==='offerta')openOffer(x.id);else openTask(x.id);return;}
  if((d=t.closest('[data-qa]'))){var q=S.domande[+d.dataset.qa];rispondi(q,d.dataset.v);return;}
  if((d=t.closest('[data-qx]'))){var q=S.domande[+d.dataset.qx];var v=prompt(q.domanda+(q.scelta?'\n(scelta provvisoria dell\'agente: '+q.scelta+')':''),'');if(v)rispondi(q,v);return;}
  if((d=t.closest('[data-qd]'))){openDecisione(S.domande[+d.dataset.qd]);return;}
  if((d=t.closest('[data-qf]'))){var q=S.domande[+d.dataset.qf];act('/api/scheda_fatto',{progetto:q.progetto,i:q.i});return;}
  if((d=t.closest('[data-cons]'))){var k=d.dataset.cons,pp=d.dataset.p;if(confirm(k==='consigli'?'Chiedo i consigli per questo progetto? Usa circa il 5-10% del contatore.':'Faccio la revisione critica con Opus? Usa circa il 30-50% del contatore.'))act('/api/'+k,{progetto:pp});return;}
  if((d=t.closest('[data-screa]'))){act('/api/scheda_crea',{progetto:d.dataset.screa},function(r){if(r.ok)openFile(r.path);});return;}
  if((d=t.closest('[data-cima]'))){act('/api/in_cima',{id:d.dataset.cima});return;}
  if((d=t.closest('[data-open]'))){e.preventDefault();openFile(d.dataset.open);return;}
  if((d=t.closest('[data-task]'))){e.preventDefault();openTask(d.dataset.task);return;}
  if((d=t.closest('[data-pact]'))){e.stopPropagation();projAct(d.dataset.pact,d.dataset.p);return;}
  if((d=t.closest('.diary .item'))&&!t.closest('a')){d.classList.toggle('open');return;}
  if((d=t.closest('[data-proj]'))){openProj(d.dataset.proj);return;}
});
function saAct(a,id,pid){var q=(S.domande||[]).find(function(x){return x.id===id;});
  if(a==='offok')return act('/api/approva',{sorgente:'cv',id:id});
  if(a==='offapri')return openOffer(id);
  if(a==='taskok')return act('/api/task_approva',{id:id});
  if(a==='dec'){q=(S.domande||[]).find(function(x){return x.tipo==='decisione'&&x.id===id;});return q?openDecisione(q):openTask(id);}
  if(a==='dom')return openDomande(pid,id);
  if(a==='scheda')return q&&q.path?openFile(q.path):toast('Scheda non trovata.',true);
  if(a==='schedaok')return q?act('/api/scheda_fatto',{progetto:q.progetto,i:q.i}):null;
  if(a==='rifai')return taskAct('rifai',id);
  if(a==='riprendi')return act('/api/stop',{sorgente:id,attiva:false});}
function projAct(a,id){var p=prj(id);
  if(a==='task')return openNewTask(id);
  if(a==='pianifica'){$('chatIn').value='Progetto '+p.nome+': vorrei pianificare le prossime task. ';showChat(true);$('chatIn').focus();return;}
  if(a==='cartella')return act('/api/apri',{path:p.cartella});
  if(a==='scout')return act('/api/scout',{sorgente:'cv'});
  if(a==='aggoff')return openAddOffer();
  if(a==='apri')return openProj(id);}

/* ---- Consumo v5 (05/10): blocco breve cliccabile + Consumo dettagliato a schede, grafici, filtri ---- */
function mnome(m){m=String(m||'');var i=m.lastIndexOf('/');return i>=0?m.slice(i+1):m;}
function mforn(m){m=String(m||'');var i=m.lastIndexOf('/');return i>=0?m.slice(0,i):'';}
function hhmm(iso){return String(iso||'').slice(11,16);}
function useHtml(B){
  if(!B)return '<span class="muted">Consumo</span>';
  var o=B.oggi,w=B.ora.filter(function(x){return x.chi!=='pannello';})[0];
  return '<span class="muted">oggi</span><b>'+o.chiamate+'</b><span class="muted">chiamate ·</span><b>'+fk(o.token)+'</b><span class="muted">token</span>'+
    (w?'<span class="vs"></span><span class="pl"><i style="background:var(--run)"></i>'+esc(w.modello||w.motore||'modello')+'</span>':'');}
function barsSvg(P,o){ /* P = [{etichetta,chiamate,errori,...}] ; colonne impilate: ok (accento) + errori (rosso) */
  o=o||{};var H=o.h||56,W=o.w||480,n=P.length||1,gap=n>30?1:2,bw=Math.max(2,(W-gap*(n-1))/n),mx=Math.max.apply(null,P.map(function(p){return p.chiamate;}).concat([1]));
  var s='<svg class="bars" viewBox="0 0 '+W+' '+(H+(o.assi?16:0))+'" preserveAspectRatio="none" role="img" aria-label="'+esc(o.titolo||'andamento')+'">';
  s+='<line x1="0" x2="'+W+'" y1="'+H+'" y2="'+H+'" class="base"/>';
  P.forEach(function(p,i){var x=i*(bw+gap),hok=H*(p.chiamate-p.errori)/mx,her=H*p.errori/mx,tip=esc((o.pre||'')+p.etichetta+(o.suf||'')+': '+p.chiamate+' chiamate'+(p.errori?' ('+p.errori+' errori)':'')+(p.token?' · '+fk(p.token)+' token':''));
    s+='<g data-tip="'+tip+'"><rect x="'+x+'" y="0" width="'+bw+'" height="'+H+'" fill="transparent"/>';
    if(p.chiamate){if(hok>0)s+='<rect x="'+x+'" y="'+(H-hok)+'" width="'+bw+'" height="'+Math.max(1.5,hok)+'" rx="'+Math.min(3,bw/3)+'" class="b-ok"/>';
      if(her>0)s+='<rect x="'+x+'" y="'+(H-hok-her-(hok>0?2:0))+'" width="'+bw+'" height="'+Math.max(1.5,her)+'" rx="'+Math.min(3,bw/3)+'" class="b-err"/>';}
    else s+='<rect x="'+x+'" y="'+(H-1.5)+'" width="'+bw+'" height="1.5" class="b-zero"/>';
    s+='</g>';
    if(o.assi&&(i===0||i===n-1||(n>8&&i%Math.ceil(n/6)===0&&i<n-2)))s+='<text x="'+(x+bw/2)+'" y="'+(H+13)+'" text-anchor="middle" class="ax">'+esc(p.etichetta)+'</text>';});
  return s+'</svg>';}
function consHtml(){
  var B=S.consumo_breve;
  if(!B)return '<h3>Consumo</h3><div class="calm">Non disponibile.</div>';

     document.querySelectorAll('[data-fp]').forEach(function(b){b.onclick=function(){toast('Provo…');api('/api/prova_motore',{motore:b.dataset.fp}).then(function(r){toast(r.msg,!r.ok);refresh();});};});
     $('iKeyP').onclick=function(){toast('Provo OpenRouter…');api('/api/prova_motore',{motore:'openrouter'}).then(function(r){toast(r.msg,!r.ok);refresh();});};
     $('iOld').onclick=function(){api('/api/vecchio').then(function(v){if(!v.cancella.length&&!v.sposta.length){toast('Già fatto: niente da togliere.');return;}
       if(confirm('Cancello:\n'+v.cancella.join('\n')+'\n\nSposto in immagini\\originali (non cancello):\n'+v.sposta.join('\n')))act('/api/vecchio_elimina',{});});};});}}
function openDir(p){api('/api/config').then(function(c){
  if(!p){drawer('<h2>Cartelle</h2><div class="flist">'+[].concat(S.progetti.filter(function(x){return x.cartella;}).map(function(x){return [x.cartella,x.nome];}),(c.cartelle_consultabili||[]).map(function(x){return [x,x];})).map(function(x){return '<a data-dir="'+esc(x[0])+'">📁 '+esc(x[1])+'</a>';}).join('')+'</div>');bindDir();return;}
  api('/api/dir?p='+encodeURIComponent(p)).then(function(d){drawer('<h2>📁 '+esc(d.p.split(/[\\/]/).pop())+'</h2><div class="muted">'+esc(d.p)+'</div><div class="acts">'+(d.su?'<button class="btn sm" data-dir="'+esc(d.su)+'">↑ Su</button>':'<button class="btn sm" id="dirHome">Tutte le cartelle</button>')+'<button class="btn sm" id="dirOpen">Apri in Esplora risorse</button></div><div class="flist">'+
    d.voci.map(function(v){return v.dir?'<a data-dir="'+esc(v.p)+'">📁 '+esc(v.nome)+'</a>':'<a data-open="'+esc(v.p)+'">📄 '+esc(v.nome)+' <span class="muted">'+esc((v.mtime||'').slice(0,16).replace('T',' '))+'</span></a>';}).join('')+'</div>');
    bindDir();$('dirOpen').onclick=function(){act('/api/apri',{path:d.p});};if($('dirHome'))$('dirHome').onclick=function(){openDir(null);};}).catch(function(){toast('Cartella non consultabile (aggiungila in Impostazioni).',true);});});}
function bindDir(){document.querySelectorAll('[data-dir]').forEach(function(a){a.onclick=function(){openDir(a.dataset.dir);};});}

/* ---------------- chat ---------------- */
function showChat(on){$('main').classList.toggle('nochat',!on);$('chat').style.display=on?'':'none';$('chatOpen').style.display=on?'none':'block';ls('chat',on?'1':'0');}
$('chatHide').onclick=function(){showChat(false);};$('chatOpen').onclick=function(){showChat(true);};showChat(ls('chat')!=='0');
var CHATP='',MOTG=ls('chatMot')||'gratis';
function mot2(m){return m==='claude'?'claude':'gratis';}   /* chat v2: solo Gratis o Claude; i vecchi motori "auto/openrouter" = Gratis */
$('chatMot').value=MOTG;$('chatMot').onchange=function(){if(!CHATP){MOTG=this.value;ls('chatMot',MOTG);}};
function setChatP(id){id=id||'';if(id===CHATP)return;var mot=$('chatMot');
  if(id){var pm=prj(id).motore||(S&&S.motori&&S.motori.predefinito)||'claude';mot.value=mot2(pm);}
  else{mot.value=MOTG;}
  CHATP=id;CHAT=CHAT||{};CHAT.storia=[];$('hChat').innerHTML=id?'· '+esc(prj(id).nome||id):hlp('chat');
  $('chatIn').placeholder=id?'Chiedi sul progetto, o descrivi una task… (Invio per mandare)':'Chiedi, o descrivi una task da mettere in coda… (Invio per mandare)';loadChat();}
function loadChat(){var pid=CHATP;return api('/api/chat'+(pid?'?progetto='+encodeURIComponent(pid):'')).then(function(c){if(pid!==CHATP)return;CHAT=c;drawChat();});}
function infoChat(i){if(!i)return '';var t=(i.tin||i.tout)?fk(i.tin)+' → '+fk(i.tout)+' token'+(i.stimato?' (stima)':''):'';
  return '<div class="muted" style="font-size:11px;margin-top:4px">'+esc(i.motore==='claude'?'Claude':'Gratis')+' · '+esc(mnome(i.modello||'?'))+(t?' · '+t:'')+' · '+(i.sec||0)+' s</div>';}
function drawChat(){var c=CHAT;$('chatN').textContent=(c.usati||0)+' messaggi oggi';
  $('msgs').innerHTML=(c.storia||[]).map(function(m){var h='<div class="msg'+(m.r==='u'?' me':'')+'">'+esc(m.t);
    (m.azioni||[]).forEach(function(a){h+='<div class="act">'+esc(a.descrizione)+'<div class="muted">'+esc(a.azione)+' · '+esc(a.stato)+(a.esito?' · '+esc(a.esito):'')+'</div>'+(a.stato==='in attesa'?'<div class="acts"><button class="btn sm pri" data-ca="'+a.id+'" data-ok="1">Conferma</button><button class="btn sm" data-ca="'+a.id+'" data-ok="0">Annulla</button></div>':'')+'</div>';});
    if(m.modifica){var x=m.modifica;h+='<div class="act">Modifica al pannello: '+esc((x.files||[]).join(', '))+' (+'+x.plus+' −'+x.minus+') · <b>'+esc(x.stato)+'</b>'+(x.errore?'<div style="color:var(--bad)">'+esc(x.errore)+'</div>':'')+
      (x.stato==='in attesa'?'<div class="acts">'+(x.errore?'':'<button class="btn sm pri" data-mod="applica" data-id="'+x.id+'">Applica</button>')+'<button class="btn sm" data-mod="diff" data-id="'+x.id+'">Vedi differenze</button><button class="btn sm" data-mod="scarta" data-id="'+x.id+'">Scarta</button></div>':'')+'</div>';}
    return h+(m.r==='a'?infoChat(m.info):'')+'</div>';}).join('')+(busyChat?'<div class="msg muted">'+esc(busyChat)+'</div>':'')+(c.rimasti<=0?'<div class="msg">Limite di oggi raggiunto. <button class="btn sm" id="chSb">Sblocca altri messaggi</button></div>':'');
  $('msgs').scrollTop=1e6;if($('chSb'))$('chSb').onclick=function(){api('/api/chat_sblocca',{}).then(function(){loadChat();});};}
$('msgs').addEventListener('click',function(e){var b=e.target.closest('[data-ca]');
  if(b){api('/api/chat_azione',{id:b.dataset.ca,conferma:b.dataset.ok==='1',progetto:CHATP}).then(function(r){toast(r.msg||'',!r.ok);loadChat();refresh();});return;}
  b=e.target.closest('[data-mod]');if(!b)return;var id=b.dataset.id;
  if(b.dataset.mod==='diff')return api('/api/modifica_diff?id='+id).then(function(r){drawer('<h2>Differenze</h2><div>'+esc(r.riassunto||'')+'</div><pre class="box" style="max-height:none">'+esc(r.diff)+'</pre>');});
  api('/api/modifica_'+b.dataset.mod,{id:id}).then(function(r){toast(r.msg||'',!r.ok);loadChat();});});
function vista(){var d=$('drawer').classList.contains('on')?($('dBody').querySelector('h2')||{}).textContent:'';return d?'finestra: '+d:'pagina principale (Centro + Progetti)';}
function send(){var t=$('chatIn').value.trim();if(!t||busyChat)return;$('chatIn').value='';busyChat=$('chatMot').value==='gratis'?'Sto pensando (modelli gratis: di solito 10-60 s)…':'Sto pensando…';CHAT.storia=(CHAT.storia||[]).concat([{r:'u',t:t}]);drawChat();
  api('/api/chat_invia',{testo:t,vista:vista(),motore:$('chatMot').value,progetto:CHATP}).then(function(r){
    if(!r.ok){toast(r.msg,true);}
    if(r.avvia_modifica){busyChat='Preparo la modifica al pannello su una copia (qualche minuto)…';drawChat();
      return api('/api/chat_modifica',{testo:r.avvia_modifica}).then(function(m){if(!m.ok)toast(m.msg,true);if(m.applicata)toast(m.applicata.msg);});}
  }).catch(function(e){toast('Errore: '+e.message,true);}).then(function(){busyChat=false;loadChat();});}
$('chatSend').onclick=send;$('chatIn').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});

refresh().then(function(){var m=location.hash.match(/task=([^&]+)/);if(m){var id=decodeURIComponent(m[1]);history.replaceState(null,'',location.pathname);
  var cv=prj('candidature').cv;if(cv&&cv.offerte.some(function(o){return o.id===id;}))openOffer(id);else openTask(id);}});loadChat();setInterval(function(){if(!document.hidden)refresh();},6000);
</script>
