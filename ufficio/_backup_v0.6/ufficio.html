<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<title>Ufficio</title>
<style>
:root{--bg:#15161a;--card:#1f2026;--ink:#ececf1;--ink2:#a2a3ad;--line:#33343c;--acc:#7b7bf0;--ok:#3fb27a;--warn:#e0a526;--bad:#ef6a62;--soft:#2a2b33;--me:#2e2f5a;--hd:#1a1b20;

--okbg:#e3f3e9;--wbg:#fff3d6;--bbg:#fbe5e3;--rbg:#e6efff;--blu:#2c5bb8}
*{box-sizing:border-box}a{color:var(--acc)}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:var(--hd);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap}
header h1{font-size:18px;margin:0 8px 0 0}
.meter{display:flex;align-items:center;gap:8px;min-width:240px}.bar{flex:1;height:10px;border-radius:6px;background:var(--soft);overflow:hidden;position:relative;min-width:110px}
.bar i{display:block;height:100%;background:var(--ok)}.bar b{position:absolute;left:80%;top:-2px;bottom:-2px;width:2px;background:var(--warn)}
.now{font-size:13px;color:var(--ink2);flex:1;min-width:200px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;animation:p 1.4s infinite}
@keyframes p{50%{opacity:.3}}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 11px;font:inherit;cursor:pointer;white-space:nowrap}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}.btn.sm{padding:3px 8px;font-size:12px}.btn:hover{filter:brightness(1.12)}.btn.red{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.menu{position:relative}.menu .dd{display:none;position:absolute;right:0;top:110%;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px #0005;min-width:200px;z-index:30}
.menu.open .dd{display:block}.dd a{display:block;padding:8px 12px;color:inherit;text-decoration:none;cursor:pointer}.dd a:hover{background:var(--soft)}
main{display:grid;grid-template-columns:1fr 340px;min-height:calc(100vh - 56px)}main.nochat{grid-template-columns:1fr 0}
.wrap{padding:18px;overflow:auto;min-width:0}
h2{font-size:15px;margin:0;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em}
.sechead{display:flex;align-items:center;gap:10px;margin:0 0 10px}.sechead .sp{flex:1}
.hub{display:grid;grid-template-columns:1.25fr 1fr 1.15fr;gap:14px;margin-bottom:22px}
@media(max-width:1250px){.hub{grid-template-columns:1fr 1fr}.hub .diary{grid-column:1/-1}}
@media(max-width:900px){main{grid-template-columns:1fr}aside.chat{display:none}.hub{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.card h3{margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-size:11px;padding:1px 7px;border-radius:10px;color:#fff;font-weight:600;white-space:nowrap}
.item{border-top:1px solid var(--line);padding:8px 0;display:flex;gap:8px;align-items:flex-start}.item:first-of-type{border-top:0}
.item .t{flex:1;min-width:0;overflow-wrap:anywhere}.muted{color:var(--ink2);font-size:12px}
.badge{background:var(--bad);color:#fff;border-radius:10px;font-size:11px;padding:0 7px}
.empty{color:var(--ink2);font-size:13px;padding:6px 0}
.diary .item{cursor:pointer}.more{display:none;background:var(--soft);border-radius:8px;padding:8px;margin-top:6px;font-size:12px;white-space:pre-wrap}
.item.open .more{display:block}.ico{width:18px;text-align:center;flex:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.proj{cursor:pointer;border-top:4px solid var(--c)}.proj:hover{box-shadow:0 4px 16px #0004}
.goal{color:var(--ink2);font-size:13px;margin:-2px 0 8px}
.steps{display:flex;gap:3px;margin:6px 0 4px}.steps span{flex:1;height:7px;border-radius:4px;background:var(--soft)}.steps .fatto{background:var(--c)}.steps .in_corso{background:repeating-linear-gradient(45deg,var(--c) 0 4px,#0000 4px 8px)}
.counts{display:flex;gap:10px;font-size:12px;color:var(--ink2);margin:6px 0;flex-wrap:wrap}.counts b{color:var(--ink)}
.status{font-size:13px;background:var(--soft);border-radius:8px;padding:6px 8px;margin:8px 0}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.need{font-size:12px;color:var(--bad);font-weight:600}
.arch{opacity:.7}
aside.chat{border-left:1px solid var(--line);background:var(--hd);display:flex;flex-direction:column;height:calc(100vh - 56px);position:sticky;top:56px}
.chat .hd{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.chat .msgs{flex:1;padding:12px;overflow:auto;font-size:13px}.msg{background:var(--soft);border-radius:10px;padding:8px 10px;margin-bottom:8px;white-space:pre-wrap;overflow-wrap:anywhere}.msg.me{background:var(--me);margin-left:30px}
.chat .in{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line)}.chat textarea{flex:1;background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px;font:inherit;resize:none;height:54px}
.act{border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin-top:6px;font-size:12px;background:var(--card)}
#chatOpen{position:fixed;right:16px;bottom:16px;z-index:8;display:none}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(680px,96vw);background:var(--card);box-shadow:-10px 0 30px #0006;transform:translateX(105%);transition:.22s;z-index:20;overflow:auto;padding:20px}
.drawer.on{transform:none}.drawer h2{color:var(--ink);text-transform:none;font-size:19px;letter-spacing:0;margin-bottom:4px}
.dclose{float:right}
.tl-row{display:flex;gap:10px;border-left:2px solid var(--line);margin-left:6px;padding:0 0 10px 14px;position:relative;font-size:12px}.tl-row:before{content:"";position:absolute;left:-6px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--acc)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:6px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--ink2);font-weight:500}
.pill{font-size:11px;border-radius:10px;padding:1px 8px;background:var(--soft);white-space:nowrap}.pill.ok{background:var(--okbg);color:var(--ok)}.pill.w{background:var(--wbg);color:var(--warn)}.pill.b{background:var(--bbg);color:var(--bad)}.pill.r{background:var(--rbg);color:var(--blu)}
.form label{display:block;margin:10px 0 4px;font-weight:600;font-size:13px}.form input,.form select,.form textarea,.inp{background:var(--soft);color:var(--ink);width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit}
.sec{margin:18px 0 6px;font-weight:700;display:flex;align-items:center;gap:8px}
.hlp{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;border:1px solid var(--ink2);color:var(--ink2);font-size:11px;cursor:pointer;position:relative;font-weight:600;text-transform:none;letter-spacing:0;flex:none}
.hlp .tip{display:none;position:absolute;left:22px;top:-6px;z-index:40;width:300px;background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;font-weight:400;line-height:1.45;box-shadow:0 8px 24px #0006;white-space:normal}
.hlp:hover .tip,.hlp.on .tip{display:block}
pre.box{background:var(--soft);border-radius:8px;padding:10px;font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:420px;overflow:auto}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--acc);color:#fff;border-radius:10px;padding:9px 14px;z-index:60;font-size:13px;max-width:80vw;display:none}
.toast.err{background:var(--bad)}
.planlist{margin:4px 0 0;padding:0;list-style:none;font-size:13px}.planlist li{padding:2px 0}
.flist a{display:block;padding:3px 0;cursor:pointer}
.row{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);min-width:0}.row:first-of-type{border-top:0}
.row .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q{padding:7px 0;border-top:1px solid var(--line)}.q:first-of-type{border-top:0}.q .opts{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.opt{border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:14px;padding:2px 9px;font:inherit;font-size:12px;cursor:pointer}
.opt.def{border-color:var(--acc)}.opt:hover{filter:brightness(1.2)}
.sub{font-size:12px;color:var(--ink2);margin:10px 0 2px;text-transform:uppercase;letter-spacing:.04em}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:14px;margin:10px 0}.kv b{color:var(--ink2);font-weight:500}
.cnt{font-size:12px;color:var(--ink2);font-weight:400}
/* ---- v0.5: Cosa succede, Consumo, schede, pagina progetto (05/10) ---- */
:root{--run:#4cc38a;--you:#f0b44c;--idle:#5d5e68}
:root[data-theme=light]{--run:#2e8b57;--you:#b07800;--idle:#a3a29c}
.sema{flex:1;min-width:260px;display:flex;align-items:center;gap:12px;padding:7px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line);cursor:pointer;flex-wrap:wrap;font-size:14px}
.sema:hover{border-color:var(--ink2)}
.pl{display:inline-flex;align-items:center;gap:6px;font-weight:600;white-space:nowrap}.pl i{width:9px;height:9px;border-radius:50%;display:inline-block}
.vs{width:1px;height:16px;background:var(--line)}
.use{display:flex;align-items:center;gap:9px;padding:7px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line);cursor:pointer;font-size:14px}
.use:hover{border-color:var(--ink2)}
.ubar{width:100px;height:7px;background:var(--soft);border-radius:4px;overflow:hidden}.ubar i{display:block;height:100%;border-radius:4px;background:var(--run)}
.top{display:grid;grid-template-columns:1.6fr .9fr;gap:16px;margin-bottom:22px;align-items:start}
@media(max-width:1250px){.top{grid-template-columns:1fr}}
.box2{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;min-width:0}
.box2 h3{font-size:16px;margin:0;display:flex;align-items:center;gap:6px}
.sx{display:flex;align-items:center;gap:8px;margin:18px 0 2px;font-weight:700;font-size:13.5px}.sx .n{color:var(--ink2);font-weight:400}
.it{display:flex;align-items:center;gap:10px;padding:9px 0 9px 12px;border-top:1px solid var(--line);position:relative}
.it::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--s,var(--idle))}
.it.run{--s:var(--run)}.it.you{--s:var(--you)}.it.bad{--s:var(--bad)}
.it .m{flex:1;min-width:0}.it .tt{font-weight:600;font-size:15px;cursor:pointer;overflow-wrap:anywhere}
.it .sb{font-size:13.5px;color:var(--ink2)}.it .sb b{color:var(--ink);font-weight:600}
.it .tm{text-align:right;white-space:nowrap}.it .t1{font-size:15px;font-weight:600}.it .t2{font-size:12px;color:var(--ink2)}
.prog{height:4px;background:var(--soft);border-radius:3px;margin-top:6px;overflow:hidden;max-width:320px}.prog i{display:block;height:100%;background:var(--run)}
.btn.y{border-color:var(--you);color:var(--you)}.btn.r{border-color:var(--bad);color:var(--bad)}
.foot{margin-top:14px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;color:var(--ink2);display:flex;gap:16px;flex-wrap:wrap}.foot b{color:var(--ink);font-weight:600}
.calm{color:var(--ink2);padding:14px 0 4px;font-size:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-left:auto}
.seg a{padding:3px 9px;font-size:12.5px;color:var(--ink2);cursor:pointer;text-decoration:none}.seg a.on{background:var(--soft);color:var(--ink);font-weight:600}
.big{font-size:26px;font-weight:700;margin:10px 0 4px}.big small{font-size:14px;color:var(--ink2);font-weight:400}
.prow{display:grid;grid-template-columns:110px 1fr 54px;align-items:center;gap:10px;padding:5px 0;font-size:14px}.prow .v{text-align:right;color:var(--ink2)}
.prow .ubar{width:auto}
.cal{display:flex;align-items:center;gap:6px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:13.5px;flex-wrap:wrap}
.cal input{width:56px;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:3px 6px;font:inherit;font-size:13px}
.pc2{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;border-left:4px solid var(--c);cursor:pointer;min-width:0}
.pc2:hover{border-color:var(--ink2);border-left-color:var(--c)}.pc2 b.nm{font-size:15.5px}
.pc2 .g{font-size:13px;color:var(--ink2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc2 .st{margin-top:8px;font-size:14px}.pc2 .ubar{width:auto;margin-top:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.pph{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;border-top:4px solid var(--c);padding-top:12px}
.pph h2{font-size:22px!important;margin:0}.pph .g{color:var(--ink2);font-size:14.5px;margin-top:2px}
.cols{display:grid;grid-template-columns:1.5fr 1fr;gap:22px;margin-top:14px}@media(max-width:700px){.cols{grid-template-columns:1fr}}
.stp{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14.5px;cursor:pointer}
.stp .ck{width:18px;height:18px;border-radius:50%;border:2px solid var(--idle);flex:none;display:flex;align-items:center;justify-content:center;font-size:11px}
.stp.fatto .ck{background:var(--c);border-color:var(--c);color:#111}.stp.fatto span.x{color:var(--ink2)}.stp.in_corso .ck{border-color:var(--c)}.stp.in_corso span.x{font-weight:700}
.kv2{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:14px}.kv2 span:first-child{color:var(--ink2)}
.drawer.wide{width:min(980px,98vw)}
</style></head><body>

<header>
  <h1 id="nome">Ufficio</h1>
  <div class="sema" id="sema" title="Cosa succede">…</div>
  <div class="use" id="use" title="Consumo"></div>
  <button class="btn" id="bTema" title="Tema chiaro/scuro">◐</button>
  <div class="menu" id="menu"><button class="btn" id="bMenu">Menu ▾</button>
    <div class="dd">
      <a data-m="imp">Impostazioni</a><a data-m="cart">Cartelle</a><a data-m="sala">Sala controllo</a><a data-m="diario">Tutto il diario</a>
      <a data-m="mondo">Mondo</a><a data-m="pausa">Pausa / riprendi agenti</a><a data-m="log">Log tecnico</a>
      <a data-m="riavvia">Riavvia Ufficio</a><a data-m="spegni" style="color:var(--bad)">Spegni Ufficio</a>
    </div></div>
</header>

<main id="main"><div class="wrap">
  <section class="top">
    <div class="box2" id="succ"></div>
    <div class="box2" id="cons"></div>
  </section>
  <div class="sechead"><h2>Progetti</h2><span id="hProg"></span><span class="sp"></span><button class="btn" id="bNuovoProg">+ Nuovo progetto</button></div>
  <section class="grid2" id="progetti"></section>
  <div class="sechead" style="margin-top:22px" id="archHead"><h2>Archiviati</h2><span id="hArch"></span></div>
  <section class="grid2" id="archiviati"></section>
</div>

<aside class="chat" id="chat"><div class="hd"><b>Chat <span id="hChat"></span></b><span class="muted"><span id="chatN"></span> · <a id="chatHide" style="cursor:pointer">nascondi</a></span></div>
  <div class="msgs" id="msgs"></div>
  <div class="in"><textarea id="chatIn" placeholder="Chiedi, o descrivi una task da mettere in coda… (Invio per mandare)"></textarea><select id="chatMot" title="Chi risponde" style="background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:8px"><option value="" id="chatMotP" disabled hidden>Come progetto</option><option value="claude">Claude</option><option value="gratis">Gratis</option></select><button class="btn pri" id="chatSend">Invia</button></div></aside>
</main>
<button class="btn pri" id="chatOpen">Chat</button>

<div class="drawer" id="drawer"><button class="btn sm dclose" id="dClose">Chiudi ✕</button><div id="dBody"></div></div>
<div class="toast" id="toast"></div>

<script>
var TOKEN=document.querySelector('meta[name=token]').content, S=null, CUR=null, CHAT=null, busyChat=false;
var HELP={
 meter:"Stima del consumo degli agenti e della chat del pannello nelle ultime 5 ore. 100% = token pesati impostati in Impostazioni (oggi 1.000.000, tua stima). A 80% avviso, a 100% i nuovi lavori aspettano che la finestra scenda. La chat Cowork non e' contata.",
 centro:"Raccoglie tutto da tutti i progetti: cosa serve da te, in che ordine lavoreranno gli agenti e cosa e' appena successo.",
 serve:"Cose che partono solo con il tuo OK: offerte (CV/lettera) e task grandi. Clic sul titolo per la scheda corta.",
 dom:"Domande degli agenti. Quasi sempre NON li fermano: l'agente ha fatto una scelta provvisoria (bordo colorato) e ha continuato. Se rispondi in modo diverso parte da sola una piccola correzione; la risposta vale anche per le task future del progetto. ⏸ = l'agente si e' fermato e aspetta te.",
 coda:"Prossimi: cosa parte, in ordine (un agente alla volta, rotazione 3-2-1 per priorita'; ↑ porta in cima). Fatto di recente: una riga per lavoro, clic per i dettagli.",
 diario:"Una riga per ogni cosa successa, scritta dal programma (0 token) dal rapporto dell'agente. Clic su una riga per i dettagli.",
 prog:"Una scheda per progetto: obiettivo, piano (le tappe le decidi tu in chat), conteggi e cosa serve da te. Clic sulla scheda per task, piano e regole. Le task si aggiungono dentro il progetto o dalla chat.",
 arch:"Progetti chiusi, con il motivo. Le loro task di chiusura restano spente finche' non le attivi.",
 succ:"Solo quello che serve adesso. Tre colori: verde = al lavoro, giallo = serve te, rosso = qualcosa è andato storto. Grigio = niente da fare per te. Dipendenze, task spente e finiti sono nella pagina di ogni progetto (clic sulla scheda).",
 coda2:"Partono in quest'ordine appena si libera un posto, alternando i progetti per priorità (3-2-1). Nessun orario fisso: il controllo è subito dopo ogni tua azione, poi ogni minuto (pannello aperto) o ogni 5 minuti (pannello chiuso).",
 cons:"Token pesati: il costo di ogni chiamata convertito in token. Le letture dalla cache costano poco e quindi pesano poco, come nei limiti di Claude. Contati dai log del PC (agenti, candidature, chat del pannello); la chat Cowork non è contata. Le barre dei progetti sono relative a quello che ha consumato di più nel periodo.",
 mot:"Claude (Pro): come sempre. Gratis, poi Claude: prova prima un modello gratuito di OpenRouter; se non funziona passa a Claude. Solo gratis: mai Claude, se non funziona finisce in Da sistemare. OpenRouter, modello scelto: usa il modello scritto nel task (anche a pagamento, dal credito OpenRouter). La chiave è salvata fuori dalle cartelle che la chat può leggere.",
 cal:"Facoltativo. Scrivi i % che vedi in Claude (5 ore e 7 giorni): il pannello li salva accanto ai token contati in quel momento. Da 3 annotazioni stima quanti token valgono il 100%.",
 chat:"Chiedi cosa succede, descrivi una task, fai modifiche al pannello. Le azioni partono solo dopo la tua conferma. Tutto finisce nel log (pannello\\chat_log.md) che rivediamo in Cowork.",
 scheda:"La scheda progetto e' il documento centrale del progetto: sopra scrivi tu (obiettivo, contesto, regole, direzioni), sotto l'Ufficio aggiorna da solo lo stato. 💡 Consigli: un agente propone le prossime task e domande (~5-10%). 🔍 Revisione critica: Opus guarda tutto da capo (~30-50%).",
 piano:"Le tappe del progetto. Una tappa con task collegate si completa da sola quando le task sono fatte; le altre le segni tu (clic sullo stato).",
 task:"Le task del progetto in tutte le cartelle: in coda, fatte, fallite, sospese (spente)."};
function hlp(k){return '<span class="hlp" data-h="'+k+'">?<span class="tip">'+esc(HELP[k]||k)+'</span></span>';}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function $(id){return document.getElementById(id);}
function api(path,body){var h={'X-Token':TOKEN};if(body)h['Content-Type']='application/json';

  if((d=t.closest('[data-ap]'))){var x=S.approva[+d.dataset.ap];if(x.tipo==='offerta')openOffer(x.id);else openTask(x.id);return;}
  if((d=t.closest('[data-qa]'))){var q=S.domande[+d.dataset.qa];rispondi(q,d.dataset.v);return;}
  if((d=t.closest('[data-qx]'))){var q=S.domande[+d.dataset.qx];var v=prompt(q.domanda+(q.scelta?'\n(scelta provvisoria dell\'agente: '+q.scelta+')':''),'');if(v)rispondi(q,v);return;}
  if((d=t.closest('[data-qd]'))){openDecisione(S.domande[+d.dataset.qd]);return;}
  if((d=t.closest('[data-qf]'))){var q=S.domande[+d.dataset.qf];act('/api/scheda_fatto',{progetto:q.progetto,i:q.i});return;}
  if((d=t.closest('[data-cons]'))){var k=d.dataset.cons,pp=d.dataset.p;if(confirm(k==='consigli'?'Chiedo i consigli per questo progetto? Usa circa il 5-10% del contatore.':'Faccio la revisione critica con Opus? Usa circa il 30-50% del contatore.'))act('/api/'+k,{progetto:pp});return;}
  if((d=t.closest('[data-screa]'))){act('/api/scheda_crea',{progetto:d.dataset.screa},function(r){if(r.ok)openFile(r.path);});return;}
  if((d=t.closest('[data-cima]'))){act('/api/in_cima',{id:d.dataset.cima});return;}
  if((d=t.closest('[data-open]'))){e.preventDefault();openFile(d.dataset.open);return;}
  if((d=t.closest('[data-task]'))){e.preventDefault();openTask(d.dataset.task);return;}
  if((d=t.closest('[data-pact]'))){e.stopPropagation();projAct(d.dataset.pact,d.dataset.p);return;}
  if((d=t.closest('.diary .item'))&&!t.closest('a')){d.classList.toggle('open');return;}
  if((d=t.closest('[data-proj]'))){openProj(d.dataset.proj);return;}
});

function bindCv(cv){
  document.querySelectorAll('[data-off]').forEach(function(a){a.onclick=function(){openOffer(a.dataset.off);};});
  document.querySelectorAll('[data-hint]').forEach(function(b){b.onclick=function(){act('/api/hint_togli',{sorgente:'cv',id:b.dataset.hint});};});
  document.querySelectorAll('[data-eff]').forEach(function(s){s.onchange=function(){act('/api/impostazione',{sorgente:'cv',chiave:s.dataset.eff,valore:s.value});};});
  if($('hS'))$('hS').onclick=function(){act('/api/hint',{sorgente:'cv',testo:$('hT').value,ambito:$('hA').value});};
  $('cvMan').onclick=function(){act('/api/manutenzione',{sorgente:'cv'});};$('cvNuove').onclick=function(){act('/api/nuove_aziende',{sorgente:'cv'});};
  $('cvMap').onclick=openMappa;$('cvReg').onclick=openRegistro;}
function openOffer(id){var cv=prj('candidature').cv;var o=cv&&cv.offerte.find(function(x){return x.id===id;});if(!o)return;
  api('/api/task?id='+encodeURIComponent(id)).then(function(d){
    var files=[].concat(d.gruppi.output||[],d.gruppi.lavoro||[]);
    drawer('<h2>'+tag('candidature')+' '+esc(o.titolo)+'</h2><div class="muted">'+esc(o.sede)+(o.pubblicata?' · pubblicata '+esc(o.pubblicata):'')+' · '+pill(o.stato)+'</div>'+
      (o.url?'<div class="acts"><a class="btn sm pri" href="'+esc(o.url)+'" target="_blank" rel="noopener">Apri l\'annuncio</a><button class="btn sm" id="oCp">Copia link</button></div>':'')+
      '<div class="status">'+esc(o.nota)+'</div>'+(o.perche?'<div class="sec">Perché va bene</div><div>'+esc(o.perche)+'</div>':'')+(o.gap?'<div class="sec">Gap principale</div><div>'+esc(o.gap)+'</div>':'')+
      '<div class="acts" style="margin-top:12px">'+(o.stato==='da_approvare'?'<button class="btn pri" id="oAp">Approva</button>':'')+(o.stato!=='scartata'?'<button class="btn red" id="oSc">Scarta…</button>':'')+
      (o.stato_raw==='pronta'||o.stato_raw==='cv_pronto'||o.stato==='fallito'||o.stato==='incompleto'?'<button class="btn" id="oRcv">Rifai CV…</button><button class="btn" id="oRle">Rifai lettera…</button>':'')+(o.cartella?'<button class="btn" id="oDir">Apri cartella output</button>':'')+'</div>'+
      '<div class="sec">File</div><div class="flist">'+(files.length?files.map(function(f){return '<a data-open="'+esc(f.p)+'">'+esc(f.nome)+'</a>';}).join(''):'<span class="muted">Ancora nessuno.</span>')+'</div>'+
      (d.log&&d.log.length?'<div class="sec">Attività</div><pre class="box">'+esc(d.log.join('\n'))+'</pre>':''));
    if($('oCp'))$('oCp').onclick=function(){navigator.clipboard.writeText(o.url).then(function(){toast('Link copiato.');});};
    if($('oAp'))$('oAp').onclick=function(){act('/api/approva',{sorgente:'cv',id:o.id},closeD);};
    if($('oSc'))$('oSc').onclick=function(){scartaOfferta(o.id,o.titolo);};
    ['cv','le'].forEach(function(f){var b=$(f==='cv'?'oRcv':'oRle');if(b)b.onclick=function(){reasonDialog('Cosa deve cambiare?',['Tono poco naturale','Dati sbagliati','Troppo lunga','Non adatta all\'azienda'],function(r){act('/api/rifai',{sorgente:'cv',id:o.id,fase:f==='cv'?'cv':'lettera',titolo:o.titolo,motivo:r.motivo,tag:r.tag,regola:r.regola},closeD);});};});
    if($('oDir'))$('oDir').onclick=function(){act('/api/apri',{path:o.cartella});};});}
function reasonDialog(tit,tags,cb){
  drawer('<h2>'+esc(tit)+'</h2><div class="muted">Facoltativo: aiuta gli agenti a migliorare.</div><div class="acts">'+tags.map(function(t){return '<label class="pill" style="cursor:pointer"><input type="checkbox" data-rt="'+esc(t)+'"> '+esc(t)+'</label>';}).join('')+'</div>'+
   '<div class="form"><label>Motivo in una riga</label><input id="rM"><label><input type="checkbox" id="rR" style="width:auto"> Trasformalo in regola per gli agenti (segnata [AUTO])</label></div><div class="acts"><button class="btn pri" id="rGo">Conferma</button></div>');
  $('rGo').onclick=function(){cb({motivo:$('rM').value,tag:[].map.call(document.querySelectorAll('[data-rt]:checked'),function(x){return x.dataset.rt;}),regola:$('rR').checked});};}
function openAddOffer(){drawer('<h2>Aggiungi offerta</h2><div class="form"><label>Link dell\'annuncio</label><input id="aU" placeholder="https://..."><label>Oppure testo incollato</label><textarea id="aT" rows="6"></textarea><label>Nota (facoltativa)</label><input id="aN"></div><div class="acts"><button class="btn pri" id="aGo">Aggiungi</button></div>');
  $('aGo').onclick=function(){act('/api/aggiungi',{sorgente:'cv',url:$('aU').value,testo:$('aT').value,nota:$('aN').value},closeD);};}
function openMappa(){api('/api/mappa').then(function(m){var rows=m.aziende||[];
  function draw(q){q=(q||'').toLowerCase();return '<table><tr><th>Azienda</th><th>Pr.</th><th>Stato</th><th>Note</th></tr>'+rows.filter(function(c){return !q||JSON.stringify(c).toLowerCase().indexOf(q)>=0;}).map(function(c){return '<tr><td>'+esc(c.name)+'<div class="muted">'+esc(c.city||c.location||'')+'</div></td><td>'+esc(c.priority||'')+'</td><td>'+esc(c.status||'')+'</td><td class="muted">'+esc((c.notes||'')+(c.nota_agente?' · '+c.nota_agente:'')).slice(0,220)+'</td></tr>';}).join('')+'</table>';}
  drawer('<h2>Mappa aziende ('+rows.length+')</h2><div class="muted">Per cambiare note o priorità chiedilo alla chat (si applica da sola e finisce nel Registro).</div><input class="inp" id="mQ" placeholder="Cerca…" style="margin:8px 0"><div id="mT">'+draw('')+'</div>');
  $('mQ').oninput=function(){$('mT').innerHTML=draw($('mQ').value);};});}
function openRegistro(){api('/api/registro').then(function(r){var rows=r.righe||[];
  drawer('<h2>Registro modifiche degli agenti</h2>'+(rows.length?rows.slice().reverse().slice(0,80).map(function(x){return '<div class="item"><div class="t"><span class="muted">'+esc((x.quando||'').replace('T',' ').slice(0,16))+' · '+esc(x.chi)+' · '+esc(x.stato)+'</span><div>'+esc(x.spiegazione||x.oggetto_nome||'')+'</div></div>'+(x.stato==='attivo'?'<button class="btn sm" data-rok="'+esc(x.id)+'">Va bene</button>':'')+(x.stato!=='annullato'?'<button class="btn sm" data-rno="'+esc(x.id)+'">Annulla</button>':'')+'</div>';}).join(''):'<div class="empty">Vuoto.</div>'));
  document.querySelectorAll('[data-rok]').forEach(function(b){b.onclick=function(){act('/api/conferma',{sorgente:'cv',id:b.dataset.rok},openRegistro);};});
  document.querySelectorAll('[data-rno]').forEach(function(b){b.onclick=function(){act('/api/annulla',{sorgente:'cv',id:b.dataset.rno},openRegistro);};});});}

/* ---------- menu ---------- */
$('bMenu').onclick=function(e){e.stopPropagation();$('menu').classList.toggle('open');};
document.querySelectorAll('[data-m]').forEach(function(a){a.onclick=function(){$('menu').classList.remove('open');menu(a.dataset.m);};});
function menu(m){
  if(m==='mondo'){location.href='/mondo';return;}
  if(m==='diario'){return api('/api/ufficio').then(function(){drawer('<h2>Diario</h2><input class="inp" id="dQ" placeholder="Filtra (progetto, task, parola)…" style="margin:8px 0"><div class="diary" id="dL"></div>');
     function draw(){var q=$('dQ').value.toLowerCase();$('dL').innerHTML=S.diario.filter(function(x){return !q||JSON.stringify(x).toLowerCase().indexOf(q)>=0;}).map(dRow).join('')||'<div class="empty">Niente.</div>';}draw();$('dQ').oninput=draw;});}
  if(m==='pausa'){var on=S.pausa.agenti||S.pausa.candidature;if(confirm(on?'Riprendere il lavoro degli agenti?':'Mettere in pausa tutti gli agenti? (il lavoro in corso finisce)')){
     act('/api/stop',{sorgente:'agents',attiva:!on});act('/api/stop',{sorgente:'cv',attiva:!on});}return;}
  if(m==='spegni'){if(confirm('Spegnere l\'Ufficio? Gli agenti continuano a lavorare da soli; per riaprirlo usa l\'icona sul desktop.'))api('/api/spegni',{}).then(function(r){document.body.innerHTML='<div style="padding:40px;font-size:16px">'+esc(r.msg)+'</div>';});return;}
  if(m==='riavvia'){api('/api/riavvia',{}).then(function(r){toast(r.msg);var n=0;var t=setInterval(function(){n++;fetch('/ping').then(function(x){if(x.ok&&n>2){clearInterval(t);location.reload();}}).catch(function(){});if(n>40)clearInterval(t);},1000);});return;}
  if(m==='log'){drawer('<h2>Log tecnico</h2><div class="flist">'+['dispatcher.log','generico\\logs\\runner.log','candidature\\stato\\log.txt','pannello\\server.log','pannello\\chat_log.md'].map(function(f){return '<a data-log="'+esc(f)+'">'+esc(f)+'</a>';}).join('')+'</div><pre class="box" id="lgB">Scegli un file.</pre>');
     document.querySelectorAll('[data-log]').forEach(function(a){a.onclick=function(){api('/api/config').then(function(c){var root=(c.sorgenti[0]||{}).radice||'';root=root.replace(/[\\\/][^\\\/]+$/,'');
       api('/api/testo?p='+encodeURIComponent(root+'\\'+a.dataset.log)).then(function(r){var l=(r.testo||'').split('\n');$('lgB').textContent=l.slice(-200).join('\n');}).catch(function(){$('lgB').textContent='(file non presente)';});});};});return;}
  if(m==='sala'){api('/api/salute').then(function(s){drawer('<h2>Sala controllo</h2><div class="sec">Avvisi</div>'+(s.avvisi.length?s.avvisi.map(function(a){return '<div class="status">'+esc(a.testo)+'</div>';}).join(''):'<div class="empty">Nessun avviso.</div>')+
     '<div class="sec">Ultimi lavori (candidature)</div><table><tr><th>Quando</th><th>Fase</th><th>Durata</th><th>Turni</th><th>Uso</th></tr>'+s.ultimi.map(function(x){return '<tr><td>'+esc((x.quando||'').slice(5,16))+'</td><td>'+esc(x.fase)+' '+esc(x.offerta||'')+(x.flags.length?' <span class="pill w">'+esc(x.flags.join(', '))+'</span>':'')+'</td><td>'+fsec(x.durata_s)+'</td><td>'+x.turni+'/'+x.max_turni+'</td><td>'+Math.round(x.costo/0.03)+'%</td></tr>';}).join('')+'</table>'+
     '<div class="sec">Contatore per fonte (ultime 5 ore)</div>'+Object.keys(S.contatore.per_fonte||{}).map(function(k){return '<div>'+esc(k)+': <b>'+Math.round(100*S.contatore.per_fonte[k]/S.contatore.token_100)+'%</b></div>';}).join('')+
     '<div class="sec">Motivi dei tuoi rifiuti</div>'+(s.feedback||[]).slice(-10).reverse().map(function(f){return '<div class="muted">'+esc(f.quando)+' · '+esc(f.azione)+' · '+esc(f.titolo)+': '+esc(f.motivo||(f.tag||[]).join(', '))+(f.regola?' <span class="pill">regola</span>':'')+'</div>';}).join(''));});return;}
  if(m==='cart'){return openDir(null);}
  if(m==='imp'){api('/api/config').then(function(c){
     drawer('<h2>Impostazioni</h2><div class="form"><label>Contatore: token pesati che valgono 100% (ultime 5 ore)</label><input id="iT" type="number" step="100000" value="'+esc(c.contatore_token_100)+'">'+
      '<label>Messaggi di chat al giorno</label><input id="iC" type="number" value="'+esc(c.chat_limite_giorno)+'">'+
      '<label>Cartelle consultabili (una per riga)</label><textarea id="iF" rows="4">'+esc((c.cartelle_consultabili||[]).join('\n'))+'</textarea>'+
      '<label>Cartelle che la chat può leggere (una per riga)</label><textarea id="iK" rows="4">'+esc((c.chat_cartelle||[]).join('\n'))+'</textarea>'+
      '<label><input type="checkbox" id="iM" style="width:auto"'+(c.modifiche_auto?' checked':'')+'> Le modifiche al pannello fatte dalla chat si applicano da sole</label></div>'+
      '<div class="sec">Motori '+hlp('mot')+'</div><div class="form"><label>Motore predefinito di tutto l\'Ufficio (se progetto e task non dicono niente)</label>'+motSel('iMot',c.motore_predefinito||'claude',false)+'<label>Chiave OpenRouter '+(S.motori&&S.motori.chiave_openrouter?'<span class="pill ok">salvata</span>':'<span class="pill w">manca</span>')+'</label>'+
      '<div style="display:flex;gap:6px"><input id="iKey" type="password" autocomplete="off" placeholder="sk-or-..."><button class="btn" id="iKeyS">Salva chiave</button><button class="btn" id="iKeyP">Prova OpenRouter</button></div></div>'+
      '<div class="acts"><button class="btn pri" id="iGo">Salva</button><button class="btn" id="iUndo">Annulla l\'ultima modifica al pannello</button><button class="btn" id="iClean">Pulisci file vecchi del pannello</button><button class="btn red" id="iOld">Elimina il pannello vecchio…</button></div>');
     $('iGo').onclick=function(){act('/api/config_set',{contatore_token_100:$('iT').value,chat_limite_giorno:$('iC').value,cartelle_consultabili:$('iF').value,chat_cartelle:$('iK').value,modifiche_auto:$('iM').checked,motore_predefinito:$('iMot').value});};
     $('iUndo').onclick=function(){if(confirm('Rimettere il pannello come prima dell\'ultima modifica applicata?'))act('/api/ripristina',{});};
     $('iClean').onclick=function(){act('/api/pulizia',{});};
     $('iKeyS').onclick=function(){act('/api/chiave',{nome:'openrouter',valore:$('iKey').value},function(){refresh().then(function(){menu('imp');});});};
     $('iKeyP').onclick=function(){toast('Provo OpenRouter…');api('/api/prova_motore',{motore:'openrouter'}).then(function(r){toast(r.msg,!r.ok);refresh();});};
     $('iOld').onclick=function(){api('/api/vecchio').then(function(v){if(!v.cancella.length&&!v.sposta.length){toast('Già fatto: niente da togliere.');return;}
       if(confirm('Cancello:\n'+v.cancella.join('\n')+'\n\nSposto in immagini\\originali (non cancello):\n'+v.sposta.join('\n')))act('/api/vecchio_elimina',{});});};});}}
function openDir(p){api('/api/config').then(function(c){
  if(!p){drawer('<h2>Cartelle</h2><div class="flist">'+[].concat(S.progetti.filter(function(x){return x.cartella;}).map(function(x){return [x.cartella,x.nome];}),(c.cartelle_consultabili||[]).map(function(x){return [x,x];})).map(function(x){return '<a data-dir="'+esc(x[0])+'">📁 '+esc(x[1])+'</a>';}).join('')+'</div>');bindDir();return;}
  api('/api/dir?p='+encodeURIComponent(p)).then(function(d){drawer('<h2>📁 '+esc(d.p.split(/[\\/]/).pop())+'</h2><div class="muted">'+esc(d.p)+'</div><div class="acts">'+(d.su?'<button class="btn sm" data-dir="'+esc(d.su)+'">↑ Su</button>':'<button class="btn sm" id="dirHome">Tutte le cartelle</button>')+'<button class="btn sm" id="dirOpen">Apri in Esplora risorse</button></div><div class="flist">'+
    d.voci.map(function(v){return v.dir?'<a data-dir="'+esc(v.p)+'">📁 '+esc(v.nome)+'</a>':'<a data-open="'+esc(v.p)+'">📄 '+esc(v.nome)+' <span class="muted">'+esc((v.mtime||'').slice(0,16).replace('T',' '))+'</span></a>';}).join('')+'</div>');
    bindDir();$('dirOpen').onclick=function(){act('/api/apri',{path:d.p});};if($('dirHome'))$('dirHome').onclick=function(){openDir(null);};}).catch(function(){toast('Cartella non consultabile (aggiungila in Impostazioni).',true);});});}
function bindDir(){document.querySelectorAll('[data-dir]').forEach(function(a){a.onclick=function(){openDir(a.dataset.dir);};});}

/* ---------------- chat ---------------- */
function showChat(on){$('main').classList.toggle('nochat',!on);$('chat').style.display=on?'':'none';$('chatOpen').style.display=on?'none':'block';ls('chat',on?'1':'0');}
$('chatHide').onclick=function(){showChat(false);};$('chatOpen').onclick=function(){showChat(true);};showChat(ls('chat')!=='0');
var CHATP='',MOTG='claude';
function setChatP(id){id=id||'';if(id===CHATP)return;var mot=$('chatMot');
  if(id){MOTG=mot.value||MOTG;$('chatMotP').disabled=false;$('chatMotP').hidden=false;mot.value='';}
  else{$('chatMotP').disabled=true;$('chatMotP').hidden=true;mot.value=MOTG||'claude';}
  CHATP=id;CHAT=CHAT||{};CHAT.storia=[];$('hChat').innerHTML=id?'· '+esc(prj(id).nome||id):hlp('chat');
  $('chatIn').placeholder=id?'Chiedi sul progetto, o descrivi una task… (Invio per mandare)':'Chiedi, o descrivi una task da mettere in coda… (Invio per mandare)';loadChat();}
function loadChat(){var pid=CHATP;return api('/api/chat'+(pid?'?progetto='+encodeURIComponent(pid):'')).then(function(c){if(pid!==CHATP)return;CHAT=c;drawChat();});}
function drawChat(){var c=CHAT;$('chatN').textContent=c.usati+'/'+c.limite+' oggi';
  $('msgs').innerHTML=(c.storia||[]).map(function(m){var h='<div class="msg'+(m.r==='u'?' me':'')+'">'+esc(m.t);
    (m.azioni||[]).forEach(function(a){h+='<div class="act">'+esc(a.descrizione)+'<div class="muted">'+esc(a.azione)+' · '+esc(a.stato)+(a.esito?' · '+esc(a.esito):'')+'</div>'+(a.stato==='in attesa'?'<div class="acts"><button class="btn sm pri" data-ca="'+a.id+'" data-ok="1">Conferma</button><button class="btn sm" data-ca="'+a.id+'" data-ok="0">Annulla</button></div>':'')+'</div>';});
    if(m.modifica){var x=m.modifica;h+='<div class="act">Modifica al pannello: '+esc((x.files||[]).join(', '))+' (+'+x.plus+' −'+x.minus+') · <b>'+esc(x.stato)+'</b>'+(x.errore?'<div style="color:var(--bad)">'+esc(x.errore)+'</div>':'')+
      (x.stato==='in attesa'?'<div class="acts">'+(x.errore?'':'<button class="btn sm pri" data-mod="applica" data-id="'+x.id+'">Applica</button>')+'<button class="btn sm" data-mod="diff" data-id="'+x.id+'">Vedi differenze</button><button class="btn sm" data-mod="scarta" data-id="'+x.id+'">Scarta</button></div>':'')+'</div>';}
    return h+'</div>';}).join('')+(busyChat?'<div class="msg muted">'+esc(busyChat)+'</div>':'')+(c.rimasti<=0?'<div class="msg">Limite di oggi raggiunto. <button class="btn sm" id="chSb">Sblocca altri messaggi</button></div>':'');
  $('msgs').scrollTop=1e6;if($('chSb'))$('chSb').onclick=function(){api('/api/chat_sblocca',{}).then(function(){loadChat();});};}
$('msgs').addEventListener('click',function(e){var b=e.target.closest('[data-ca]');
  if(b){api('/api/chat_azione',{id:b.dataset.ca,conferma:b.dataset.ok==='1',progetto:CHATP}).then(function(r){toast(r.msg||'',!r.ok);loadChat();refresh();});return;}
  b=e.target.closest('[data-mod]');if(!b)return;var id=b.dataset.id;
  if(b.dataset.mod==='diff')return api('/api/modifica_diff?id='+id).then(function(r){drawer('<h2>Differenze</h2><div>'+esc(r.riassunto||'')+'</div><pre class="box" style="max-height:none">'+esc(r.diff)+'</pre>');});
  api('/api/modifica_'+b.dataset.mod,{id:id}).then(function(r){toast(r.msg||'',!r.ok);loadChat();});});
function vista(){var d=$('drawer').classList.contains('on')?($('dBody').querySelector('h2')||{}).textContent:'';return d?'finestra: '+d:'pagina principale (Centro + Progetti)';}
function send(){var t=$('chatIn').value.trim();if(!t||busyChat)return;$('chatIn').value='';busyChat='Sto pensando…';CHAT.storia=(CHAT.storia||[]).concat([{r:'u',t:t}]);drawChat();
  api('/api/chat_invia',{testo:t,vista:vista(),motore:$('chatMot').value,progetto:CHATP}).then(function(r){
    if(!r.ok){toast(r.msg,true);}
    if(r.avvia_modifica){busyChat='Preparo la modifica al pannello su una copia (qualche minuto)…';drawChat();
      return api('/api/chat_modifica',{testo:r.avvia_modifica}).then(function(m){if(!m.ok)toast(m.msg,true);if(m.applicata)toast(m.applicata.msg);});}
  }).catch(function(e){toast('Errore: '+e.message,true);}).then(function(){busyChat=false;loadChat();});}
$('chatSend').onclick=send;$('chatIn').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});

refresh().then(function(){var m=location.hash.match(/task=([^&]+)/);if(m){var id=decodeURIComponent(m[1]);history.replaceState(null,'',location.pathname);
  var cv=prj('candidature').cv;if(cv&&cv.offerte.some(function(o){return o.id===id;}))openOffer(id);else openTask(id);}});loadChat();setInterval(function(){if(!document.hidden)refresh();},6000);
</script>
