<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="token" content="__TOKEN__">
<title>Ufficio</title>
<style>
:root{--bg:#15161a;--card:#1f2026;--ink:#ececf1;--ink2:#a2a3ad;--line:#33343c;--acc:#7b7bf0;--ok:#3fb27a;--warn:#e0a526;--bad:#ef6a62;--soft:#2a2b33;--me:#2e2f5a;--hd:#1a1b20;
--okbg:#1f3a2c;--wbg:#3d3218;--bbg:#43201e;--rbg:#1f2c48;--blu:#7aa2ff}
:root[data-theme=light]{--bg:#f5f4f0;--card:#fff;--ink:#1d1d1f;--ink2:#5b5b63;--line:#e3e1da;--acc:#5b5bd6;--ok:#2e8b57;--warn:#b07800;--bad:#c4413a;--soft:#efeee9;--me:#e8e8ff;--hd:#fff;
--okbg:#e3f3e9;--wbg:#fff3d6;--bbg:#fbe5e3;--rbg:#e6efff;--blu:#2c5bb8}
*{box-sizing:border-box}a{color:var(--acc)}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:var(--hd);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap}
header h1{font-size:18px;margin:0 8px 0 0}
.meter{display:flex;align-items:center;gap:8px;min-width:240px}.bar{flex:1;height:10px;border-radius:6px;background:var(--soft);overflow:hidden;position:relative;min-width:110px}
.bar i{display:block;height:100%;background:var(--ok)}.bar b{position:absolute;left:80%;top:-2px;bottom:-2px;width:2px;background:var(--warn)}
.now{font-size:13px;color:var(--ink2);flex:1;min-width:200px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;animation:p 1.4s infinite}
@keyframes p{50%{opacity:.3}}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 11px;font:inherit;cursor:pointer;white-space:nowrap}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}.btn.sm{padding:3px 8px;font-size:12px}.btn:hover{filter:brightness(1.12)}.btn.red{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.menu{position:relative}.menu .dd{display:none;position:absolute;right:0;top:110%;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px #0005;min-width:200px;z-index:30}
.menu.open .dd{display:block}.dd a{display:block;padding:8px 12px;color:inherit;text-decoration:none;cursor:pointer}.dd a:hover{background:var(--soft)}
main{display:grid;grid-template-columns:1fr 340px;min-height:calc(100vh - 56px)}main.nochat{grid-template-columns:1fr 0}
.wrap{padding:18px;overflow:auto;min-width:0}
h2{font-size:15px;margin:0;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em}
.sechead{display:flex;align-items:center;gap:10px;margin:0 0 10px}.sechead .sp{flex:1}
.hub{display:grid;grid-template-columns:1.25fr 1fr 1.15fr;gap:14px;margin-bottom:22px}
@media(max-width:1250px){.hub{grid-template-columns:1fr 1fr}.hub .diary{grid-column:1/-1}}
@media(max-width:900px){main{grid-template-columns:1fr}aside.chat{display:none}.hub{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.card h3{margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-size:11px;padding:1px 7px;border-radius:10px;color:#fff;font-weight:600;white-space:nowrap}
.item{border-top:1px solid var(--line);padding:8px 0;display:flex;gap:8px;align-items:flex-start}.item:first-of-type{border-top:0}
.item .t{flex:1;min-width:0;overflow-wrap:anywhere}.muted{color:var(--ink2);font-size:12px}
.badge{background:var(--bad);color:#fff;border-radius:10px;font-size:11px;padding:0 7px}
.empty{color:var(--ink2);font-size:13px;padding:6px 0}
.diary .item{cursor:pointer}.more{display:none;background:var(--soft);border-radius:8px;padding:8px;margin-top:6px;font-size:12px;white-space:pre-wrap}
.item.open .more{display:block}.ico{width:18px;text-align:center;flex:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.proj{cursor:pointer;border-top:4px solid var(--c)}.proj:hover{box-shadow:0 4px 16px #0004}
.goal{color:var(--ink2);font-size:13px;margin:-2px 0 8px}
.steps{display:flex;gap:3px;margin:6px 0 4px}.steps span{flex:1;height:7px;border-radius:4px;background:var(--soft)}.steps .fatto{background:var(--c)}.steps .in_corso{background:repeating-linear-gradient(45deg,var(--c) 0 4px,#0000 4px 8px)}
.counts{display:flex;gap:10px;font-size:12px;color:var(--ink2);margin:6px 0;flex-wrap:wrap}.counts b{color:var(--ink)}
.status{font-size:13px;background:var(--soft);border-radius:8px;padding:6px 8px;margin:8px 0}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.need{font-size:12px;color:var(--bad);font-weight:600}
.arch{opacity:.7}
aside.chat{border-left:1px solid var(--line);background:var(--hd);display:flex;flex-direction:column;height:calc(100vh - 56px);position:sticky;top:56px}
.chat .hd{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.chat .msgs{flex:1;padding:12px;overflow:auto;font-size:13px}.msg{background:var(--soft);border-radius:10px;padding:8px 10px;margin-bottom:8px;white-space:pre-wrap;overflow-wrap:anywhere}.msg.me{background:var(--me);margin-left:30px}
.chat .in{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line)}.chat textarea{flex:1;background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px;font:inherit;resize:none;height:54px}
.act{border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin-top:6px;font-size:12px;background:var(--card)}
#chatOpen{position:fixed;right:16px;bottom:16px;z-index:8;display:none}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(680px,96vw);background:var(--card);box-shadow:-10px 0 30px #0006;transform:translateX(105%);transition:.22s;z-index:20;overflow:auto;padding:20px}
.drawer.on{transform:none}.drawer h2{color:var(--ink);text-transform:none;font-size:19px;letter-spacing:0;margin-bottom:4px}
.dclose{float:right}
.tl-row{display:flex;gap:10px;border-left:2px solid var(--line);margin-left:6px;padding:0 0 10px 14px;position:relative;font-size:12px}.tl-row:before{content:"";position:absolute;left:-6px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--acc)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:6px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--ink2);font-weight:500}
.pill{font-size:11px;border-radius:10px;padding:1px 8px;background:var(--soft);white-space:nowrap}.pill.ok{background:var(--okbg);color:var(--ok)}.pill.w{background:var(--wbg);color:var(--warn)}.pill.b{background:var(--bbg);color:var(--bad)}.pill.r{background:var(--rbg);color:var(--blu)}
.form label{display:block;margin:10px 0 4px;font-weight:600;font-size:13px}.form input,.form select,.form textarea,.inp{background:var(--soft);color:var(--ink);width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit}
.sec{margin:18px 0 6px;font-weight:700;display:flex;align-items:center;gap:8px}
.hlp{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;border:1px solid var(--ink2);color:var(--ink2);font-size:11px;cursor:pointer;position:relative;font-weight:600;text-transform:none;letter-spacing:0;flex:none}
.hlp .tip{display:none;position:absolute;left:22px;top:-6px;z-index:40;width:300px;background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;font-weight:400;line-height:1.45;box-shadow:0 8px 24px #0006;white-space:normal}
.hlp:hover .tip,.hlp.on .tip{display:block}
pre.box{background:var(--soft);border-radius:8px;padding:10px;font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:420px;overflow:auto}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--acc);color:#fff;border-radius:10px;padding:9px 14px;z-index:60;font-size:13px;max-width:80vw;display:none}
.toast.err{background:var(--bad)}
.planlist{margin:4px 0 0;padding:0;list-style:none;font-size:13px}.planlist li{padding:2px 0}
.flist a{display:block;padding:3px 0;cursor:pointer}
.row{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);min-width:0}.row:first-of-type{border-top:0}
.row .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q{padding:7px 0;border-top:1px solid var(--line)}.q:first-of-type{border-top:0}.q .opts{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.opt{border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:14px;padding:2px 9px;font:inherit;font-size:12px;cursor:pointer}
.opt.def{border-color:var(--acc)}.opt:hover{filter:brightness(1.2)}
.sub{font-size:12px;color:var(--ink2);margin:10px 0 2px;text-transform:uppercase;letter-spacing:.04em}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:14px;margin:10px 0}.kv b{color:var(--ink2);font-weight:500}
.cnt{font-size:12px;color:var(--ink2);font-weight:400}
</style></head><body>

<header>
  <h1 id="nome">Ufficio</h1>
  <div class="meter"><span class="muted">Uso 5 ore</span><span id="hMeter"></span><div class="bar"><i id="mbar" style="width:0"></i><b></b></div><b id="mpct">–</b></div>
  <div class="now" id="now">…</div>
  <button class="btn" id="bTema" title="Tema chiaro/scuro">◐</button>
  <div class="menu" id="menu"><button class="btn" id="bMenu">Menu ▾</button>
    <div class="dd">
      <a data-m="imp">Impostazioni</a><a data-m="cart">Cartelle</a><a data-m="sala">Sala controllo</a><a data-m="diario">Tutto il diario</a>
      <a data-m="mondo">Mondo</a><a data-m="pausa">Pausa / riprendi agenti</a><a data-m="log">Log tecnico</a>
      <a data-m="riavvia">Riavvia Ufficio</a><a data-m="spegni" style="color:var(--bad)">Spegni Ufficio</a>
    </div></div>
</header>

<main id="main"><div class="wrap">
  <div class="sechead"><h2>Centro</h2></div>
  <section class="hub">
    <div class="card"><h3>Da approvare <span class="badge" id="nApp">0</span><span id="hServe"></span></h3><div id="approva"></div></div>
    <div class="card"><h3>Domande <span class="badge" id="nDom">0</span><span id="hDom"></span></h3><div id="domande"></div></div>
    <div class="card diary"><h3>Attività <span id="hCoda"></span></h3><div class="sub">Prossimi</div><div id="coda"></div><div class="sub">Fatto di recente</div><div id="diario"></div><a class="muted" id="tuttoDiario" style="cursor:pointer">Tutto il diario →</a></div>
  </section>
  <div class="sechead"><h2>Progetti</h2><span id="hProg"></span><span class="sp"></span><button class="btn" id="bNuovoProg">+ Nuovo progetto</button></div>
  <section class="grid" id="progetti"></section>
  <div class="sechead" style="margin-top:22px" id="archHead"><h2>Archiviati</h2><span id="hArch"></span></div>
  <section class="grid" id="archiviati"></section>
</div>

<aside class="chat" id="chat"><div class="hd"><b>Chat <span id="hChat"></span></b><span class="muted"><span id="chatN"></span> · <a id="chatHide" style="cursor:pointer">nascondi</a></span></div>
  <div class="msgs" id="msgs"></div>
  <div class="in"><textarea id="chatIn" placeholder="Chiedi, o descrivi una task da mettere in coda… (Invio per mandare)"></textarea><button class="btn pri" id="chatSend">Invia</button></div></aside>
</main>
<button class="btn pri" id="chatOpen">Chat</button>

<div class="drawer" id="drawer"><button class="btn sm dclose" id="dClose">Chiudi ✕</button><div id="dBody"></div></div>
<div class="toast" id="toast"></div>

<script>
var TOKEN=document.querySelector('meta[name=token]').content, S=null, CUR=null, CHAT=null, busyChat=false;
var HELP={
 meter:"Stima del consumo degli agenti e della chat del pannello nelle ultime 5 ore. 100% = token pesati impostati in Impostazioni (oggi 1.000.000, tua stima). A 80% avviso, a 100% i nuovi lavori aspettano che la finestra scenda. La chat Cowork non e' contata.",
 centro:"Raccoglie tutto da tutti i progetti: cosa serve da te, in che ordine lavoreranno gli agenti e cosa e' appena successo.",
 serve:"Cose che partono solo con il tuo OK: offerte (CV/lettera) e task grandi. Clic sul titolo per la scheda corta.",
 dom:"Domande degli agenti. Quasi sempre NON li fermano: l'agente ha fatto una scelta provvisoria (bordo colorato) e ha continuato. Se rispondi in modo diverso parte da sola una piccola correzione; la risposta vale anche per le task future del progetto. ⏸ = l'agente si e' fermato e aspetta te.",
 coda:"Prossimi: cosa parte, in ordine (un agente alla volta, rotazione 3-2-1 per priorita'; ↑ porta in cima). Fatto di recente: una riga per lavoro, clic per i dettagli.",
 diario:"Una riga per ogni cosa successa, scritta dal programma (0 token) dal rapporto dell'agente. Clic su una riga per i dettagli.",
 prog:"Una scheda per progetto: obiettivo, piano (le tappe le decidi tu in chat), conteggi e cosa serve da te. Clic sulla scheda per task, piano e regole. Le task si aggiungono dentro il progetto o dalla chat.",
 arch:"Progetti chiusi, con il motivo. Le loro task di chiusura restano spente finche' non le attivi.",
 chat:"Chiedi cosa succede, descrivi una task, fai modifiche al pannello. Le azioni partono solo dopo la tua conferma. Tutto finisce nel log (pannello\\chat_log.md) che rivediamo in Cowork.",
 scheda:"La scheda progetto e' il documento centrale del progetto: sopra scrivi tu (obiettivo, contesto, regole, direzioni), sotto l'Ufficio aggiorna da solo lo stato. 💡 Consigli: un agente propone le prossime task e domande (~5-10%). 🔍 Revisione critica: Opus guarda tutto da capo (~30-50%).",
 piano:"Le tappe del progetto. Una tappa con task collegate si completa da sola quando le task sono fatte; le altre le segni tu (clic sullo stato).",
 task:"Le task del progetto in tutte le cartelle: in coda, fatte, fallite, sospese (spente)."};
function hlp(k){return '<span class="hlp" data-h="'+k+'">?<span class="tip">'+esc(HELP[k]||k)+'</span></span>';}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function $(id){return document.getElementById(id);}
function api(path,body){var h={'X-Token':TOKEN};if(body)h['Content-Type']='application/json';
  return fetch(path,{method:body?'POST':'GET',headers:h,body:body?JSON.stringify(body):undefined}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();});}
function toast(m,err){var t=$('toast');t.textContent=m;t.className='toast'+(err?' err':'');t.style.display='block';clearTimeout(t._t);t._t=setTimeout(function(){t.style.display='none';},4500);}
function act(path,body,after){return api(path,body).then(function(r){toast(r.msg||(r.ok?'Fatto.':'Non riuscito.'),!r.ok);refresh();if(after)after(r);return r;}).catch(function(e){toast('Errore: '+e.message,true);});}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}
function prj(id){return (S&&S.progetti||[]).find(function(p){return p.id===id;})||{nome:id||'—',sigla:(id||'?').slice(0,2).toUpperCase(),colore:'#777'};}
function tag(id){var p=prj(id);return '<span class="tag" style="background:'+esc(p.colore)+'">'+esc(p.sigla||p.nome)+'</span>';}
function pill(st){var m={fatto:['ok','fatto'],done:['ok','fatto'],completato:['ok','fatto'],in_corso:['r','in corso'],in_coda:['','in coda'],da_approvare:['w','da approvare'],
  bloccato:['w','domande'],fallito:['b','fallito'],failed:['b','fallito'],incompleto:['w','incompleto'],sospeso:['','spento'],scartata:['','scartata'],da_fare:['','da fare'],limit:['w','limite'],blocked:['w','domande']};
  var x=m[st]||['',st];return '<span class="pill '+x[0]+'">'+esc(x[1])+'</span>';}
function fsec(s){if(s==null)return '';s=Math.round(s);return s<90?s+' s':Math.round(s/60)+' min';}
function sid(id){var m=String(id||'').match(/^[A-Z]+\d+/);return m?m[0]:String(id||'');}
function corto(t){return String(t||'').replace(/\s*\((m\/w\/d|w\/m\/d|m\/f\/d|f\/m\/x|mwd)\)/ig,'').replace(/^(.{0,60}).*$/,'$1');}
function sm(q){return q?(' · <b>'+q+'%</b>'):'';}

/* ---------------- tema e aiuti ---------------- */
function tema(t){if(t==='light')document.documentElement.dataset.theme='light';else delete document.documentElement.dataset.theme;}
tema(ls('tema'));
$('bTema').onclick=function(){var n=document.documentElement.dataset.theme==='light'?'dark':'light';tema(n);ls('tema',n);};
[['hMeter','meter'],['hServe','serve'],['hDom','dom'],['hCoda','coda'],['hProg','prog'],['hArch','arch'],['hChat','chat']].forEach(function(x){$(x[0]).innerHTML=hlp(x[1]);});
document.addEventListener('click',function(e){var h=e.target.closest('.hlp');document.querySelectorAll('.hlp.on').forEach(function(x){if(x!==h)x.classList.remove('on');});if(h){e.stopPropagation();h.classList.toggle('on');}
  if(!e.target.closest('#menu'))$('menu').classList.remove('open');},true);

/* ---------------- render principale ---------------- */
function refresh(){return api('/api/ufficio').then(function(s){S=s;render();}).catch(function(e){$('now').innerHTML='<span style="color:var(--bad)">Non riesco a leggere lo stato: '+esc(e.message)+'</span>';});}
function render(){
  var c=S.contatore||{};var col=c.pausa?'var(--bad)':c.avviso?'var(--warn)':'var(--ok)';
  $('mbar').style.width=Math.min(100,c.pct||0)+'%';$('mbar').style.background=col;$('mpct').textContent=(c.pct||0)+'%';$('mpct').style.color=c.avviso?col:'';
  var a=S.agente;
  $('now').innerHTML=a?'<span class="dot"></span>Al lavoro: '+tag(a.progetto)+' <b>'+esc(a.titolo)+'</b> · da '+fsec(a.da_s):
    (S.limite?'<span style="color:var(--warn)">⏸ Limite di Claude: riparte da solo dopo le '+esc(S.limite)+'</span>':
     (S.pausa.agenti||S.pausa.candidature)?'<span style="color:var(--warn)">⏸ In pausa: '+(S.pausa.agenti?'task generici ':'')+(S.pausa.candidature?'candidature':'')+' (Menu → Pausa / riprendi)</span>':
     S.perche_fermo?esc(S.perche_fermo):'Nessun agente al lavoro'+(S.coda.some(function(x){return x.pronto;})?' · parte a breve':''));
  /* da approvare */
  var ap=S.approva||[],fl=S.falliti||[];$('nApp').textContent=ap.length+fl.length;$('nApp').style.display=(ap.length+fl.length)?'':'none';
  $('approva').innerHTML=(ap.length||fl.length)?ap.map(function(x,i){
    return '<div class="row">'+tag(x.progetto)+'<span class="t" data-ap="'+i+'" title="'+esc(x.per_te)+' (clic per la scheda)">'+(x.proposta?'💡 ':'')+esc(corto(x.titolo))+'</span>'+
      '<button class="btn sm pri" data-apok="'+i+'">Approva</button></div>';}).join('')+
    fl.map(function(x){return '<div class="row">'+tag(x.progetto)+'<span class="t" data-task="'+esc(x.id)+'">✗ '+esc(x.titolo)+'</span><button class="btn sm" data-task="'+esc(x.id)+'">Vedi</button></div>';}).join(''):'<div class="empty">Niente da approvare.</div>';
  /* domande */
  var dq=S.domande||[];$('nDom').textContent=dq.length;$('nDom').style.display=dq.length?'':'none';
  $('domande').innerHTML=dq.length?dq.slice(0,8).map(function(q,i){
    var op=(q.opzioni||[]).map(function(o){var d=q.scelta&&o.toLowerCase()===q.scelta.toLowerCase();return '<button class="opt'+(d?' def':'')+'" data-qa="'+i+'" data-v="'+esc(o)+'" title="'+(d?'scelta provvisoria dell\'agente':'')+'">'+esc(o)+'</button>';}).join('');
    if(q.tipo==='scheda')return '<div class="q">'+tag(q.progetto)+' 📝 '+esc(q.domanda)+'<div class="opts">'+(q.path?'<button class="opt" data-open="'+esc(q.path)+'">Apri scheda</button>':'')+'<button class="opt" data-qf="'+i+'">Fatto</button></div></div>';
    return '<div class="q">'+tag(q.progetto)+' '+(q.ferma?'⏸ ':'')+esc(q.domanda)+'<div class="opts">'+op+(q.tipo==='decisione'?'<button class="opt" data-qd="'+i+'">Rispondi…</button>':'<button class="opt" data-qx="'+i+'">Altro…</button>')+'</div></div>';}).join('')+(dq.length>8?'<div class="muted">+'+(dq.length-8)+' altre</div>':''):'<div class="empty">Nessuna domanda.</div>';
  /* attivita */
  var cq=S.coda.slice(0,4);
  $('coda').innerHTML=(a?'<div class="row"><span class="dot"></span>'+tag(a.progetto)+'<span class="t">'+esc(a.titolo)+'</span><span class="muted">in corso</span></div>':'')+

/* ---------------- click globali ---------------- */
document.addEventListener('click',function(e){
  var t=e.target, d;
  if((d=t.closest('[data-apok]'))){var x=S.approva[+d.dataset.apok];if(x.tipo==='offerta')act('/api/approva',{sorgente:'cv',id:x.id});else act('/api/task_approva',{id:x.id});return;}
  if((d=t.closest('[data-apno]'))){var x=S.approva[+d.dataset.apno];scartaOfferta(x.id,x.titolo);return;}
  if((d=t.closest('[data-ap]'))){var x=S.approva[+d.dataset.ap];if(x.tipo==='offerta')openOffer(x.id);else openTask(x.id);return;}
  if((d=t.closest('[data-qa]'))){var q=S.domande[+d.dataset.qa];rispondi(q,d.dataset.v);return;}
  if((d=t.closest('[data-qx]'))){var q=S.domande[+d.dataset.qx];var v=prompt(q.domanda+(q.scelta?'\n(scelta provvisoria dell\'agente: '+q.scelta+')':''),'');if(v)rispondi(q,v);return;}
  if((d=t.closest('[data-qd]'))){openDecisione(S.domande[+d.dataset.qd]);return;}
  if((d=t.closest('[data-qf]'))){var q=S.domande[+d.dataset.qf];act('/api/scheda_fatto',{progetto:q.progetto,i:q.i});return;}
  if((d=t.closest('[data-cons]'))){var k=d.dataset.cons,pp=d.dataset.p;if(confirm(k==='consigli'?'Chiedo i consigli per questo progetto? Usa circa il 5-10% del contatore.':'Faccio la revisione critica con Opus? Usa circa il 30-50% del contatore.'))act('/api/'+k,{progetto:pp});return;}
  if((d=t.closest('[data-screa]'))){act('/api/scheda_crea',{progetto:d.dataset.screa},function(r){if(r.ok)openFile(r.path);});return;}
  if((d=t.closest('[data-cima]'))){act('/api/in_cima',{id:d.dataset.cima});return;}
  if((d=t.closest('[data-open]'))){e.preventDefault();openFile(d.dataset.open);return;}
  if((d=t.closest('[data-task]'))){e.preventDefault();openTask(d.dataset.task);return;}
  if((d=t.closest('[data-pact]'))){e.stopPropagation();projAct(d.dataset.pact,d.dataset.p);return;}
  if((d=t.closest('.diary .item'))&&!t.closest('a')){d.classList.toggle('open');return;}
  if((d=t.closest('[data-proj]'))){openProj(d.dataset.proj);return;}
});
function projAct(a,id){var p=prj(id);
  if(a==='task')return openNewTask(id);
  if(a==='pianifica'){$('chatIn').value='Progetto '+p.nome+': vorrei pianificare le prossime tappe e task. ';showChat(true);$('chatIn').focus();return;}
  if(a==='cartella')return act('/api/apri',{path:p.cartella});
  if(a==='scout')return act('/api/scout',{sorgente:'cv'});
  if(a==='aggoff')return openAddOffer();
  if(a==='apri')return openProj(id);}

    (m.azioni||[]).forEach(function(a){h+='<div class="act">'+esc(a.descrizione)+'<div class="muted">'+esc(a.azione)+' · '+esc(a.stato)+(a.esito?' · '+esc(a.esito):'')+'</div>'+(a.stato==='in attesa'?'<div class="acts"><button class="btn sm pri" data-ca="'+a.id+'" data-ok="1">Conferma</button><button class="btn sm" data-ca="'+a.id+'" data-ok="0">Annulla</button></div>':'')+'</div>';});

    return h+'</div>';}).join('')+(busyChat?'<div class="msg muted">'+esc(busyChat)+'</div>':'')+(c.rimasti<=0?'<div class="msg">Limite di oggi raggiunto. <button class="btn sm" id="chSb">Sblocca altri messaggi</button></div>':'');

function send(){var t=$('chatIn').value.trim();if(!t||busyChat)return;$('chatIn').value='';busyChat='Sto pensando…';CHAT.storia=(CHAT.storia||[]).concat([{r:'u',t:t}]);drawChat();
  api('/api/chat_invia',{testo:t,vista:vista()}).then(function(r){

  }).catch(function(e){toast('Errore: '+e.message,true);}).then(function(){busyChat=false;loadChat();});}

refresh().then(function(){var m=location.hash.match(/task=([^&]+)/);if(m){var id=decodeURIComponent(m[1]);history.replaceState(null,'',location.pathname);
